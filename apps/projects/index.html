<title>Доска проектов — LifeOS</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1117">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="../kitchen/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../kitchen/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Проекты">
<style>
:root{
 /* шаг сетки один на всё: отступы 13/14/15/17 рядом читались как «чуть не сходится» */
 --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;

  --bg:#0E1117;--card:#161A21;--card2:#1B2029;--card3:#20262F;--line:#252C36;--line2:#2E3742;
  --tx:#E2E6EC;--mu:#8D96A3;--dim:#838E9C;
  --acc:#5FA294;--ok:#5BC98A;--warn:#E3B341;--bad:#E06C5B;--idle:#6E7683;--plan:#6E8FD0;
  /* текст поверх акцентной заливки: на тёмной теме почти чёрный, на светлой — белый */
  --onacc:#04211E;--shadow:0 8px 14px rgba(0,0,0,.55);--veil:rgba(4,7,11,.6);
  --rowh:52px;
}
@media(prefers-color-scheme:light){:root{
  --bg:#F7F8FA;--card:#FFF;--card2:#F1F4F8;--card3:#E7ECF3;--line:#DFE4EB;--line2:#C6CEDA;
  --tx:#151A21;--mu:#535D6B;--dim:#5E6774;
  --acc:#0F6F62;--ok:#177A46;--warn:#8A6410;--bad:#B0402D;--idle:#7B8595;--plan:#2F58A6;
  --onacc:#FFF;--shadow:0 6px 12px rgba(23,32,48,.18);--veil:rgba(28,36,48,.34)}}
:root[data-theme="dark"]{--bg:#0E1117;--card:#161A21;--card2:#1B2029;--card3:#20262F;--line:#252C36;--line2:#2E3742;
 --tx:#E2E6EC;--mu:#8D96A3;--dim:#838E9C;--acc:#5FA294;--ok:#5BC98A;--warn:#E3B341;--bad:#E06C5B;--idle:#6E7683;--plan:#6E8FD0;
 --onacc:#04211E;--shadow:0 8px 14px rgba(0,0,0,.55);--veil:rgba(4,7,11,.6)}
:root[data-theme="light"]{--bg:#F7F8FA;--card:#FFF;--card2:#F1F4F8;--card3:#E7ECF3;--line:#DFE4EB;--line2:#C6CEDA;
 --tx:#151A21;--mu:#535D6B;--dim:#5E6774;--acc:#0F6F62;--ok:#177A46;--warn:#8A6410;--bad:#B0402D;--idle:#7B8595;--plan:#2F58A6;
 --onacc:#FFF;--shadow:0 6px 12px rgba(23,32,48,.18);--veil:rgba(28,36,48,.34)}
:root[data-dense="1"]{--rowh:38px}

*{box-sizing:border-box}
/* место под полосу прокрутки держим всегда: иначе появление скролла сдвигает весь экран */
html{scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
/* цифры одной ширины — счётчики меняются, а вёрстка стоит на месте */
.seg button .n,.gh .cnt,.tabs button i,.met,.updc,.mono{font-variant-numeric:tabular-nums}
.seg button .n{min-width:15px;text-align:right}
/* плавность там, где меняется только цвет: ничего не двигается, но и не мигает */
.btn,.seg button,.fchip,.chipset button,.kopt,.cell,.subcard,.lane,.intcard,.ra,.tl,.cchip,.schip,.who,.lnk,
.mile,.td,.dep,.addbtn,.setb,.menu button{
 transition:background-color .16s ease,border-color .16s ease,color .16s ease,opacity .16s ease}
/* смена экрана — короткое проявление вместо мгновенной подмены */
@keyframes sw{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(-5px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slidein{from{transform:translateX(26px);opacity:.35}to{transform:none;opacity:1}}
.swap{animation:sw .19s ease-out}
/* у карточки-приложения только проявление без сдвига: transform на ней делает
   её точкой отсчёта для fixed-панелей, и выпадающий поиск начинает обрезаться */
.swapf{animation:fadein .18s ease-out}
.menu.on{animation:pop .13s ease-out}
.mod.on{animation:fadein .15s ease-out}
.mod.on .modbox{animation:sw .2s ease-out}
.peek.on{animation:fadein .15s ease-out}
.peek.on .peekbox{animation:slidein .21s ease-out}
@media(prefers-reduced-motion:reduce){
 .swap,.menu.on,.mod.on,.mod.on .modbox,.peek.on,.peek.on .peekbox{animation:none}
 *{transition:none!important}}
.page{max-width:1440px;margin:0 auto;padding:22px 16px 60px;display:flex;flex-direction:column;gap:14px}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
svg{display:block;flex:none}
button{font:inherit;cursor:pointer}

/* ---------- шапка ---------- */
.app{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.topbar{display:flex;gap:9px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
/* на доске нужен настоящий верхний уровень шкалы, иначе всё в диапазоне 11-15 и иерархии нет */
.brand{font-weight:700;font-size:22px;letter-spacing:-.015em;display:flex;gap:9px;align-items:center}
.brand em{font-style:normal;color:var(--dim);font-weight:400;font-size:13px}
.seg{display:flex;gap:3px;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:3px}
/* вес шрифта одинаковый у активной и неактивной: жирный шире обычного и дёргал соседей */
.seg button{background:none;border:none;color:var(--mu);font-size:13px;padding:5px 11px;border-radius:6px;
 display:flex;gap:6px;align-items:center;font-weight:650}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button .n{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim)}
/* поиск — значок, поле выпадает панелькой под ним. Не растягиваем ширину:
   анимация ширины двигает всю шапку, а выпадающая панель ничего не сдвигает вовсе. */
.searchbox{position:relative;flex:none;width:35px;height:31px;display:flex;align-items:center;
 justify-content:center;background:var(--card2);border:1px solid var(--line);border-radius:8px;
 color:var(--mu);cursor:pointer}
.searchbox:hover,.searchbox.op{border-color:var(--acc);color:var(--tx)}
/* панель поиска висит поверх страницы, а не внутри карточки: у карточки обрезка по краям,
   и выпадающая панель внутри неё срезалась бы по скруглению */
.sfield{position:fixed;width:min(340px,62vw);display:flex;gap:9px;
 align-items:center;background:var(--card);border:1px solid var(--acc);border-radius:10px;
 padding:9px 12px;box-shadow:var(--shadow);z-index:12;cursor:text;
 opacity:0;transform:translateY(-5px);pointer-events:none;transition:opacity .15s ease,transform .15s ease}
.sfield.on{opacity:1;transform:none;pointer-events:auto}
.sfield input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--tx);font:inherit;font-size:15px}
.spacer{flex:1}
.searchbox kbd{font:600 11px/1 ui-monospace,monospace;border:1px solid var(--line2);border-radius:4px;padding:3px 5px}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--mu);border-radius:8px;
 padding:6px 11px;font-size:13px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--acc);color:var(--tx)}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:650}
.btn.s{padding:5px 9px;font-size:12px}
.btn.i{padding:6px;width:31px;justify-content:center}
.btn.on{border-color:var(--acc);color:var(--tx)}

/* высота и ширины кусков заданы: счётчики и цель меняются, полоса не пляшет */
/* вторая полоса — весь контекст сразу: где смотрим, в каком цикле, чем группируем.
   Строго одна строка фиксированной высоты: перенос менял высоту шапки при переключении. */
.ctx[hidden]{display:none}
.ctx{display:flex;gap:10px;align-items:center;padding:0 14px;height:46px;
 border-bottom:1px solid var(--line);background:var(--card2);overflow:hidden}
.cycwrap{display:flex;gap:10px;align-items:center;flex:1;min-width:0;overflow:hidden;
 font-size:13px;color:var(--mu);white-space:nowrap}
.cycwrap>span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cycwrap>.seg,.cycwrap>.wk,.cycwrap>.cchip,.cycwrap>.cycinfo{flex:none}
.ctxacts{display:flex;gap:6px;align-items:center;flex:none}
.cycwrap b{color:var(--tx)}
.wk{display:flex;gap:3px;flex:none;width:120px}
.ctxsep{width:1px;height:20px;background:var(--line2);flex:none}
.wk s{flex:1;height:6px;border-radius:2px;background:var(--line);text-decoration:none}
.wk s.on{background:var(--acc)}

/* ---------- что дальше ---------- */
.next3{display:block}
/* состояние несёт значок и подпись, а не толстая полоса сбоку: боковая планка на скруглённой
   карточке — самый узнаваемый штамп сгенерированного интерфейса */
.n3{background:var(--card2);border:1px solid color-mix(in srgb,var(--c,var(--acc)) 30%,var(--line));
 border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.n3 .t svg{color:var(--c,var(--acc))}
.n3 .t{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);
 display:flex;gap:7px;align-items:center}
.n3 .t b{color:var(--tx);font-size:12px;letter-spacing:0;text-transform:none;font-weight:650}
.n3 .s{font-size:15px;color:var(--tx);line-height:1.35}
.n3 .b{display:flex;gap:6px;align-items:center;margin-top:auto}

/* ---------- массовые действия ---------- */
.bulk{display:none;gap:9px;align-items:center;padding:9px 14px;background:color-mix(in srgb,var(--acc) 12%,var(--card2));
 border-bottom:1px solid var(--line);font-size:13px;color:var(--tx);flex-wrap:wrap}
.bulk.on{display:flex}
.bulk b{font-family:ui-monospace,monospace}

/* ---------- группы ---------- */
.ghempty{display:flex;gap:var(--s2);align-items:center;padding:7px var(--s4);
 border-bottom:1px solid var(--line);font-size:12.5px;color:var(--dim)}
.ghempty b{color:var(--mu);font-weight:600}
.ghempty .gdot{width:7px;height:7px;border-radius:50%;background:var(--gc);flex:none}
.gh{display:grid;gap:11px;align-items:center;padding:0 14px;height:38px;
 grid-template-columns:16px 16px 14px 20px 30px minmax(0,1fr) 132px 104px 52px 92px;
 color:var(--mu);background:var(--card2);border-top:1px solid var(--line);
 border-bottom:1px solid var(--line);cursor:pointer;user-select:none;font-size:13px}
.gh:hover{color:var(--tx)}
.gh .ghname{display:flex;gap:9px;align-items:center;min-width:0}
.gh .ghname b{color:var(--tx);font-weight:650}
.gh .gcar{color:var(--dim);display:flex;justify-content:center;transition:transform .18s;transform:rotate(90deg)}
.gh.cl .gcar{transform:rotate(0)}
.gh .cnt{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim);background:var(--card);
 border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.gh .gdot{width:7px;height:7px;border-radius:2px;background:var(--gc,var(--dim));justify-self:center}
.gh.over{background:color-mix(in srgb,var(--acc) 14%,var(--card2));color:var(--tx)}
/* подписи колонок живут в той же строке и сортируют по клику */
.cap2{font-size:12px;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:4px;
 white-space:nowrap;cursor:pointer}
.cap2:hover{color:var(--tx)}
.cap2.on{color:var(--acc)}
.cap2 .ar{opacity:0;display:flex}.cap2.on .ar{opacity:1}
.grp.cl{display:none}

/* ---------- сетка строки ---------- */
.row{min-height:52px;display:grid;gap:11px;align-items:center;padding:0 14px;
 grid-template-columns:16px 16px 14px 20px 30px minmax(0,1fr) 132px 104px 52px 92px}

.row{height:var(--rowh);border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--card2)}
.row.op{background:var(--card2)}
.row.sel{background:color-mix(in srgb,var(--acc) 9%,var(--card2))}
/* галочка видна всегда — иначе выделение «не находится» и режим выглядит сломанным */
.row .cb{width:15px;height:15px;border:1.5px solid var(--line2);border-radius:4px;display:grid;
 place-items:center;color:transparent;justify-self:center;transition:.12s}
.row:hover .cb{border-color:var(--mu)}
.row.sel .cb{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.gh .selall{margin-left:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
 color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--card)}
.gh .selall:hover{border-color:var(--acc);color:var(--tx)}
.row .drg{color:var(--dim);opacity:0;cursor:grab;display:flex;justify-content:center;transition:opacity .12s}
.row:hover .drg{opacity:.6}.row .drg:hover{opacity:1;color:var(--tx)}
.row.dragging{opacity:.4}
.row.over-top{box-shadow:inset 0 2px 0 var(--acc)}
.row.over-bot{box-shadow:inset 0 -2px 0 var(--acc)}
/* бросок в середину строки — вложить внутрь, а не переставить рядом */
.row.over-in{box-shadow:inset 0 0 0 2px var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card2))}
.sp[draggable="true"]{cursor:grab}
.sp.dragging{opacity:.4}
/* у стрелки своя площадка 22×22 с подложкой: раньше по ней было непонятно, попал ты или нет.
   Отрицательные поля держат колонку в 14px, чтобы сетка строки не поехала. */
.caret{width:22px;height:22px;margin:0 -4px;border-radius:7px;display:grid;place-items:center;
 color:var(--dim);transition:transform .18s,background-color .14s,color .14s}
.caret:hover{background:var(--card3);color:var(--tx)}
.caret:active{background:var(--line2)}
.row.op .caret{transform:rotate(90deg);color:var(--acc)}
.row.op .caret:hover{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.pico{color:var(--c);display:flex;justify-content:center;opacity:.9}
.hd{width:9px;height:9px;border-radius:50%;background:var(--c);justify-self:center}
/* имя занимает свою колонку целиком и ужимается многоточием */
.nm{min-width:0;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* категория — своя колонка, чип с цветом. Клик по чипу фильтрует список */
.catc{display:flex;justify-content:center;align-items:center;gap:4px;min-width:0;
 cursor:pointer;padding:3px;border-radius:9px;border:1px solid transparent}
.catc:hover{border-color:var(--line2);background:var(--card)}
.cat{font-size:11px;line-height:1;padding:5px 8px;border-radius:20px;white-space:nowrap;
 min-width:0;overflow:hidden;text-overflow:ellipsis;
 color:var(--cc);border:1px solid color-mix(in srgb,var(--cc) 38%,transparent);
 background:color-mix(in srgb,var(--cc) 13%,transparent)}
.cat.more{--cc:var(--mu);flex:none}
.cat.empty{--cc:var(--dim);border-style:dashed}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);}
/* у ожидания шкалы нет — пунктир вместо полосы, чтобы не изображать прогресс */
.bar.wait{background:none;border-top:1px dashed var(--line2);border-radius:0;height:1px}
.met{display:flex;justify-content:center;align-items:baseline;gap:2px;
 font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums}
.met b{font-size:15px;font-weight:600;color:var(--tx)}
.met u{text-decoration:none;font-size:11px;color:var(--dim)}
.updc{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim);text-align:center;
 font-variant-numeric:tabular-nums}
.spk{display:flex;justify-content:center;color:var(--c);opacity:.75}
.rowacts{display:flex;gap:5px;justify-content:center}
.ra{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:7px;
 width:28px;height:28px;display:grid;place-items:center;padding:0;transition:.13s}
.ra:hover{border-color:var(--acc);color:var(--acc);background:var(--card3)}
.ra.dis{opacity:.3;pointer-events:none}

/* строка-черновик */
.draft{display:grid;gap:11px;align-items:center;padding:0 14px;height:var(--rowh);
 grid-template-columns:16px 16px 14px 20px 30px minmax(0,1fr) auto;
 border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--acc) 8%,var(--card2))}
.draft input{background:var(--card);border:1px solid var(--acc);border-radius:7px;padding:6px 10px;
 color:var(--tx);font:inherit;font-size:15px;outline:none;width:100%}

/* ---------- раскрытие ---------- */
.exp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease;background:var(--card3);
 border-bottom:1px solid var(--line)}
.exp.op{grid-template-rows:1fr}
.exp>div{overflow:hidden;visibility:hidden;transition:visibility 0s .22s}
.exp.op>div{visibility:visible;transition:visibility 0s}
.inner{padding:0 14px 14px 148px;display:flex;flex-direction:column;gap:12px}
.exp.op .inner{padding-top:13px}
@media(max-width:760px){.inner{padding-left:26px}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
.stt{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.stt b{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.stt span{font-size:15px;color:var(--tx)}.stt span.off{color:var(--dim)}
/* значение можно задать прямо тут: пунктирная кнопка вместо мёртвого «не задана» */
.edt{cursor:pointer;border-bottom:1px dashed var(--line2)}
.edt:hover{border-color:var(--acc);color:var(--acc)}
.setb{display:inline-flex;gap:5px;align-items:center;background:none;border:1px dashed var(--line2);
 color:var(--dim);border-radius:7px;padding:3px 8px;font-size:13px}
.setb:hover{border-color:var(--acc);color:var(--tx)}
.tin{width:100%;background:var(--card);border:1px solid var(--acc);border-radius:6px;
 padding:4px 7px;color:var(--tx);font:inherit;font-size:13px;outline:none}
.minib{width:54px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.minib i{display:block;height:100%;background:var(--acc)}
.mile .del{opacity:0;background:none;border:none;color:var(--dim);padding:2px;display:flex;border-radius:5px}
.mile:hover .del{opacity:1}
.mile .del:hover{color:var(--bad)}
.emptyline{font-size:13px;color:var(--dim);padding:2px 8px 6px}
/* пустой проект: вместо шести пустых секций — один блок с тем, что реально стоит сделать */
.qs{background:var(--card2);border:1px dashed var(--line2);border-radius:11px;padding:13px 15px;
 display:flex;flex-direction:column;gap:12px}
.qsh{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;font-size:15px}
.qsh b{font-weight:650}
.qsh span{color:var(--dim);font-size:13px}
.qsb{display:flex;gap:7px;flex-wrap:wrap}
.addrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.addrow .lbl{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-right:2px}
/* подпроект раскрывается своими вехами — у куска своя жизнь, а была одна строка */
.sp{cursor:pointer}
.scar{color:var(--dim);display:flex;justify-content:center;transition:transform .16s}
.sp.op .scar{transform:rotate(90deg);color:var(--acc)}
.subx{display:grid;grid-template-rows:0fr;transition:grid-template-rows .18s ease}
.subx.op{grid-template-rows:1fr}
.subx>div{overflow:hidden;visibility:hidden;transition:visibility 0s .18s}
.subx.op>div{visibility:visible;transition:visibility 0s}
.mile.sm{padding-left:36px;font-size:13px}
.when{font-size:11px;color:var(--dim);font-family:ui-monospace,monospace}
/* чего ждёт проект */
.dep{display:grid;grid-template-columns:16px minmax(0,1fr) auto auto;gap:9px;align-items:center;
 padding:5px 8px;border-radius:7px;font-size:13px;color:var(--mu)}
.dep:hover{background:var(--card2)}
.dep .dnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
.dep.block .dnm{color:var(--warn)}
.dep .del{opacity:0}.dep:hover .del{opacity:1}
/* ссылки наружу */
.links{display:flex;flex-wrap:wrap;gap:6px}
.lnk{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--mu);
 background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:5px 10px;cursor:pointer}
.lnk:hover{border-color:var(--acc);color:var(--tx)}
.lnk.add2{border-style:dashed;color:var(--dim)}
.lnk .del{opacity:0;margin-left:1px}.lnk:hover .del{opacity:.7}
/* свободная заметка */
.note{width:100%;min-height:62px;resize:vertical;background:var(--card2);border:1px solid var(--line);
 border-radius:9px;padding:10px 12px;color:var(--tx);font:inherit;font-size:13px;outline:none;line-height:1.55}
.note:focus{border-color:var(--acc)}
.note::placeholder{color:var(--dim)}
.exgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}
.exgrid>div>div+div{margin-top:14px}
@media(max-width:860px){.exgrid{grid-template-columns:1fr}}
/* заголовок секции — обычный текст с весом, а не капс вразрядку:
   капс читается медленнее и на длинных подписях выглядит декоративной наклейкой */
.sect{font-size:12px;font-weight:650;color:var(--mu);
 display:flex;align-items:center;gap:9px;margin-bottom:8px}
.sect .ln{flex:1;height:1px;background:var(--line)}
.sect .num{font-family:ui-monospace,monospace;letter-spacing:.04em;color:var(--mu)}
.sph,.sp{display:grid;grid-template-columns:16px 20px minmax(0,1fr) 80px 38px 58px;gap:10px;align-items:center}
.sph{height:24px;padding:0 8px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.sph .c{text-align:center}.sph .r{text-align:right}
.sp{height:33px;padding:0 8px;border-radius:7px;font-size:13px;color:var(--mu)}
.sp:hover{background:var(--card2)}
.sp .gr{color:var(--dim);opacity:0;cursor:grab;display:flex;justify-content:center}
.sp:hover .gr{opacity:1}
/* имя и пояснение подпроекта режутся каждое само по себе: раньше пояснение вылезало
   за пределы строки на сотню пикселей и просто пряталось под соседней колонкой */
.sp .snm{display:flex;gap:9px;align-items:baseline;min-width:0;color:var(--tx);font-weight:500}
.sp .snm>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp .snm em{flex:1;min-width:0;font-style:normal;color:var(--dim);font-weight:400;font-size:12px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp .spc{font:600 12px/1 ui-monospace,monospace;text-align:center;color:var(--mu)}
.sp .tools{display:flex;gap:3px;opacity:0;justify-content:flex-end}
.sp:hover .tools{opacity:1}
.tl{background:none;border:1px solid transparent;color:var(--dim);border-radius:6px;padding:4px;display:flex}
.tl:hover{border-color:var(--line2);color:var(--tx)}
.addbtn{display:flex;gap:7px;align-items:center;width:100%;margin-top:4px;background:none;
 border:1px dashed var(--line2);color:var(--dim);border-radius:8px;padding:7px 10px;font-size:13px}
.addbtn:hover{border-color:var(--acc);color:var(--tx)}
.add{display:none;gap:7px;align-items:center;margin-top:4px}
.add.on{display:flex}
.add input{flex:1;background:var(--card);border:1px solid var(--acc);border-radius:8px;padding:7px 10px;
 color:var(--tx);font:inherit;font-size:13px;outline:none}
.mile{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:9px;align-items:center;
 font-size:13px;padding:5px 8px;cursor:pointer;color:var(--mu);border-radius:7px}
.mile:hover{color:var(--tx);background:var(--card2)}
.mile s{width:16px;height:16px;border:1px solid var(--line2);border-radius:4px;display:grid;
 place-items:center;text-decoration:none;color:transparent}
.mile.done{color:var(--dim)}
.mile.done s{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.mile.next{color:var(--tx);background:color-mix(in srgb,var(--acc) 8%,transparent)}
.mile.next s{border-color:var(--acc)}
.mile .tag{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--acc);
 border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);border-radius:20px;padding:2px 7px}

/* ---------- общие проекты ---------- */
/* имя и значок «общий» живут в одной ячейке: колонка не едет, выравнивание держится */
.nmw{display:flex;gap:8px;align-items:center;min-width:0}
/* общий проект видно с первого взгляда: полоса слева + лица участников вместо числа */
/* общий проект и так подписан лицами участников — полоса слева нужна тонкая, как метка, а не как акцент */
.row.sh{box-shadow:inset 1px 0 0 var(--plan)}
.pghd.sh{box-shadow:inset 1px 0 0 var(--plan)}
.avs{display:flex;align-items:center;flex:none;cursor:pointer}
.avs s{width:19px;height:19px;border-radius:50%;text-decoration:none;display:grid;place-items:center;
 font:600 11px/1 "Segoe UI",sans-serif;color:#0B1A18;background:var(--pc);
 border:1.5px solid var(--card);margin-left:-6px}
.avs s:first-child{margin-left:0}
.avs:hover s{border-color:var(--acc)}
.shb{display:inline-flex;gap:4px;align-items:center;flex:none;font-size:11px;letter-spacing:.04em;
 color:var(--plan);border:1px solid color-mix(in srgb,var(--plan) 38%,transparent);
 background:color-mix(in srgb,var(--plan) 12%,transparent);border-radius:20px;padding:2px 7px;
 font-family:ui-monospace,monospace}
.who{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--mu);
 background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 9px 3px 3px;cursor:pointer}
.who s{width:18px;height:18px;border-radius:50%;text-decoration:none;display:grid;place-items:center;
 font:600 11px/1 "Segoe UI",sans-serif;color:#0B1A18;background:var(--pc,var(--acc))}
.who:hover{border-color:var(--acc);color:var(--tx)}
.who.free{color:var(--dim)}
.who.free s{background:none;border:1px dashed var(--line2);color:var(--dim)}
.synk{display:flex;gap:9px;align-items:center;padding:8px 18px;font-size:12px;color:var(--mu);
 background:color-mix(in srgb,var(--plan) 8%,var(--card2));border-bottom:1px solid var(--line);flex-wrap:wrap}
.synk b{color:var(--tx);font-weight:600}
.synk code{font-family:ui-monospace,monospace;font-size:12px;color:var(--plan)}

/* ---------- вкладки внутри проекта ---------- */
.tabs{display:flex;gap:3px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--card)}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--mu);
 font-size:15px;padding:10px 13px;display:flex;gap:7px;align-items:center;margin-bottom:-1px;font-weight:650}
.tabs button:hover{color:var(--tx)}
.tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}
.tabs button i{font-style:normal;font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);
 background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:2px 7px}
.tabs button.on i{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}

/* ---------- задачи ---------- */
.tdbar{display:flex;gap:7px;align-items:center;margin-bottom:11px;flex-wrap:wrap}
.fchip{font-size:12px;color:var(--mu);background:var(--card2);border:1px solid var(--line);
 border-radius:20px;padding:4px 11px}
.fchip.on{border-color:var(--acc);color:var(--tx);background:color-mix(in srgb,var(--acc) 12%,var(--card2))}
.td{display:grid;grid-template-columns:18px minmax(0,1fr) auto 46px 20px;gap:11px;align-items:center;
 padding:7px 9px;border-radius:8px;font-size:15px;color:var(--tx);cursor:pointer}
.td:hover{background:var(--card2)}
.td s{width:17px;height:17px;border:1px solid var(--line2);border-radius:5px;display:grid;
 place-items:center;text-decoration:none;color:transparent}
.td.done{color:var(--dim)}
.td.done .tdt{text-decoration:line-through}
.td.done s{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.td .tdt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td .del{opacity:0;background:none;border:none;color:var(--dim);padding:2px;display:flex;border-radius:5px}
.td:hover .del{opacity:1}.td .del:hover{color:var(--bad)}
.tdsep{display:flex;align-items:center;gap:9px;margin:13px 0 5px;font-size:11px;letter-spacing:.05em;
 text-transform:uppercase;color:var(--dim)}
.tdsep .ln{flex:1;height:1px;background:var(--line)}
/* канбан задач */
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;align-items:start}
@media(max-width:760px){.kb{grid-template-columns:1fr}}
.kbc{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:9px}
.kbh{display:flex;align-items:center;gap:8px;padding:2px 4px 9px;font-size:11px;letter-spacing:.05em;
 text-transform:uppercase;color:var(--mu);font-weight:650}
.kbh .cnt{margin-left:auto;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.04em;
 color:var(--dim);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2px 8px}
.kbb{display:flex;flex-direction:column;gap:7px;min-height:64px;border-radius:8px;padding:2px}
.kbb.over{background:color-mix(in srgb,var(--acc) 12%,transparent);outline:1px dashed var(--acc)}
.kbempty{font-size:12px;color:var(--dim);padding:14px 6px;text-align:center}
.kc{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 10px;
 display:flex;flex-direction:column;gap:8px;cursor:grab}
.kc:hover{border-color:var(--acc)}
.kc.dragging{opacity:.4}
.kc.done .kct{color:var(--dim);text-decoration:line-through}
.kct{font-size:13px;line-height:1.35}
.kcf{display:flex;align-items:center;gap:8px}
.kcf .when{margin-left:auto}

/* ---------- страница проекта ---------- */
/* имя — вход на страницу; остальная строка по-прежнему раскрывает предпросмотр */
.nm[data-t]{cursor:pointer}
.nm[data-t]:hover{color:var(--acc);text-decoration:underline;text-underline-offset:3px}
.pgtop{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumb{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--dim);min-width:0;flex:1}
.crumb u{text-decoration:none;color:var(--mu);cursor:pointer;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis;max-width:210px}
.crumb u:hover{color:var(--acc)}
.crumb i{font-style:normal;color:var(--line2)}
.crumb b{color:var(--tx);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pghd{display:flex;gap:13px;align-items:flex-start;padding:17px 18px 13px;border-bottom:1px solid var(--line)}
.pghd .pgi{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none;
 color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);
 border:1px solid color-mix(in srgb,var(--c) 32%,transparent)}
.pgnm{min-width:0;flex:1;display:flex;flex-direction:column;gap:7px}
.pgnm h1{margin:0;font-size:24px;line-height:1.22;font-weight:700;letter-spacing:-.012em;
 overflow-wrap:anywhere;cursor:text}
.pgnm h1:hover{color:var(--acc)}
.pgnm .sub{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mu)}
.schip{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:4px 10px;border-radius:20px;
 background:var(--card2);border:1px solid var(--line);color:var(--tx);cursor:pointer}
.schip:hover{border-color:var(--acc)}
.schip s{width:7px;height:7px;border-radius:2px;background:var(--sc);text-decoration:none}
.pgacts{display:flex;gap:6px;align-items:center;flex:none}
.pgstat{display:grid;grid-template-columns:auto repeat(4,1fr);gap:11px;align-items:center;
 padding:15px 18px;border-bottom:1px solid var(--line);background:var(--card2)}
@media(max-width:860px){.pgstat{grid-template-columns:auto 1fr 1fr}}
.pgring{display:flex;gap:12px;align-items:center;padding-right:16px;border-right:1px solid var(--line)}
.pgring .v{display:flex;flex-direction:column;gap:2px}
.pgring .v b{font:700 24px/1 ui-monospace,monospace;font-variant-numeric:tabular-nums;color:var(--tx)}
.pgring .v span{font-size:12px;color:var(--dim)}
.pgbody{display:grid;grid-template-columns:1.12fr .88fr;gap:22px;padding:18px}
@media(max-width:900px){.pgbody{grid-template-columns:1fr}}
.pgcol{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 13px 13px}
.card .sect{margin-bottom:8px}
.subcard{display:grid;grid-template-columns:20px minmax(0,1fr) 54px 40px 26px;gap:11px;align-items:center;
 padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card2);
 cursor:pointer;transition:.13s;margin-bottom:7px}
.subcard:hover{border-color:var(--acc);background:var(--card3)}
.subcard .snm2{min-width:0}
.subcard .snm2 b{display:block;font-size:15px;font-weight:600;color:var(--tx);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subcard .snm2 span{font-size:12px;color:var(--dim)}
.subcard .go{color:var(--dim);display:flex;justify-content:flex-end}
.subcard:hover .go{color:var(--acc)}
.feed{display:grid;grid-template-columns:44px minmax(0,1fr);gap:9px 11px;font-size:13px;color:var(--mu)}
.feed .d{font:12px/1.5 ui-monospace,monospace;color:var(--dim);font-variant-numeric:tabular-nums}
/* календарь серии: 35 клеток, сегодня обведено */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(15px,1fr));gap:4px;margin-bottom:9px}
.cal s{aspect-ratio:1;border-radius:4px;background:var(--line);text-decoration:none;display:block}
.cal s.on{background:var(--acc)}
.cal s.td{outline:1.5px solid var(--tx);outline-offset:1px}
.feed em{font-style:normal;color:var(--dim);font-size:12px}

/* ---------- быстрый просмотр ---------- */
.peek{position:fixed;inset:0;background:var(--veil);display:none;z-index:20}
.peek.on{display:block}
.peekbox{position:absolute;right:0;top:0;bottom:0;width:min(560px,92vw);background:var(--card);
 border-left:1px solid var(--line);display:flex;flex-direction:column}
.peekhd{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.peekhd h3{margin:0;font-size:18px}
.peekbody{padding:16px;overflow:auto;font-size:15px;color:var(--mu);line-height:1.6}
.peekbody pre{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;
 font:13px/1.7 ui-monospace,monospace;color:var(--tx);overflow-x:auto;margin:0 0 14px}
.peekbody h4{color:var(--tx);font-size:13px;margin:0 0 6px;letter-spacing:.06em;text-transform:uppercase}

/* ---------- меню «шашлык» ---------- */
.menu{position:fixed;z-index:40;min-width:214px;background:var(--card);border:1px solid var(--line2);
 border-radius:10px;padding:5px;box-shadow:var(--shadow);display:none}
.menu.on{display:block}
.menu button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:none;
 color:var(--tx);font-size:15px;padding:8px 10px;border-radius:7px;text-align:left}
.menu button:hover{background:var(--card2)}
.menu button .k{margin-left:auto;font:600 11px/1 ui-monospace,monospace;color:var(--dim);
 border:1px solid var(--line);border-radius:4px;padding:3px 5px}
.menu button.dis{opacity:.35;pointer-events:none}
.menu button.danger{color:var(--bad)}
.menu button.danger:hover{background:color-mix(in srgb,var(--bad) 15%,transparent)}
.menu .sep{height:1px;background:var(--line);margin:5px 6px}
.menu .cap{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);padding:6px 10px 3px}
.menu .st{display:flex;gap:9px;align-items:center}
.menu .st .d{width:8px;height:8px;border-radius:2px;background:var(--sc)}
/* пометка «выбрано» — словом или иконкой, без пустых рамок: пустая рамка читалась как «а что тут?» */
.menu .mk{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--acc)}
.menu .mk.off{color:var(--dim)}
.menu button:hover .mk.off{color:var(--tx)}
.menu .note2{font-size:12px;color:var(--dim);line-height:1.5;padding:2px 10px 8px;max-width:250px}
.menu .note2 code{font-family:ui-monospace,monospace;color:var(--plan);font-size:12px}

/* ---------- окно нового проекта ---------- */
.mod{position:fixed;inset:0;background:var(--veil);display:none;z-index:50;
 align-items:flex-start;justify-content:center;padding:6vh 16px 20px;overflow:auto}
.mod.on{display:flex}
.modbox{width:min(620px,100%);background:var(--card);border:1px solid var(--line2);border-radius:14px;
 box-shadow:var(--shadow);overflow:hidden}
.modhd{display:flex;gap:10px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
.modhd h3{margin:0;font-size:18px}
.modbody{padding:17px 18px;display:flex;flex-direction:column;gap:17px}
.fld{display:flex;flex-direction:column;gap:7px}
.fld>b{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);font-weight:650}
.fin{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;
 color:var(--tx);font:inherit;font-size:15px;outline:none;width:100%}
.fin:focus{border-color:var(--acc)}
.fin::placeholder{color:var(--dim)}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
@media(max-width:620px){.kgrid{grid-template-columns:repeat(2,1fr)}}
.kopt{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 8px;
 display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--mu);font-size:13px;transition:.13s}
.kopt:hover{border-color:var(--line2);color:var(--tx)}
.kopt.on{border-color:var(--acc);color:var(--tx);background:color-mix(in srgb,var(--acc) 12%,var(--card2))}
.kopt.on svg{color:var(--acc)}
.khint{font-size:12px;color:var(--dim);line-height:1.45;min-height:17px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chipset button{font-size:12px;color:var(--mu);background:var(--card2);border:1px solid var(--line);
 border-radius:20px;padding:5px 11px}
.chipset button.on{border-color:var(--cc,var(--acc));color:var(--tx);
 background:color-mix(in srgb,var(--cc,var(--acc)) 14%,var(--card2))}
.modft{display:flex;gap:9px;align-items:center;padding:13px 18px;border-top:1px solid var(--line);
 background:var(--card2)}
.modft .prev{font-size:12px;color:var(--dim);min-width:0}
.modft .prev b{color:var(--tx);font-weight:600}

/* ---------- цикл ---------- */
.cchip{display:inline-flex;gap:7px;align-items:center;background:var(--card);border:1px solid var(--line2);
 border-radius:20px;padding:4px 10px;color:var(--tx);font-size:13px}
.cchip:hover{border-color:var(--acc)}
.cchip span{color:var(--dim);font-family:ui-monospace,monospace;font-size:11px}
.cgoal{color:var(--mu);border-bottom:1px dashed var(--line2);cursor:pointer;max-width:280px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cgoal:hover{color:var(--tx);border-color:var(--acc)}
.seg.sm button{padding:3px 9px;font-size:12px}
.wk s.now{background:var(--tx)}
.cyrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:11px;align-items:center;padding:8px 11px;
 border:1px solid var(--line);border-radius:9px;background:var(--card2);margin-bottom:7px}
.cyrow .nm2{font-size:15px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cyrow .nm2 em{font-style:normal;color:var(--dim);font-size:12px;margin-left:8px}

/* ---------- пространства ---------- */
.seg button em{font-style:normal;font-family:ui-monospace,monospace;font-size:11px;color:var(--onacc);
 background:var(--plan);border-radius:20px;padding:1px 5px}
/* на узком экране полоса срезает лишнее по очереди: сперва цель, потом клетки недель.
   Фильтр цикла и группировка не срезаются никогда — ими пользуешься. */
.cgoal{min-width:0;flex:0 1 auto}
@media(max-width:1180px){.cgoal{display:none}}
@media(max-width:1080px){.wk,.cycinfo .opt{display:none}}
@media(max-width:900px){.cycinfo .opt2{display:none}}
/* узко — у невыбранных пространств остаётся значок: имя есть в подсказке и в меню */
#wsf{min-width:0;overflow:hidden}
@media(max-width:1080px){
 #wsf button:not(.on) .lbl{display:none}
 #wsf button.plus{display:none}}
.wsbar b{color:var(--tx);font-weight:600}
.wsbar code{font-family:ui-monospace,monospace;font-size:12px;color:var(--plan)}

/* ---------- сегодня: сетка дней и дела ----------
   Календарь на доске не месяцем во всю ширину, а плотной сеткой квадратов:
   двенадцать недель влезают в 210 px и сразу видно, где были провалы. */
.today{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s3) var(--s4);
 border-bottom:1px solid var(--line)}
.today.mini{padding:0}
.daybar{width:100%;display:flex;gap:var(--s2);align-items:center;background:none;border:none;
 border-bottom:1px solid var(--line);color:var(--tx);font:inherit;font-size:13.5px;
 padding:9px var(--s4);cursor:pointer;text-align:left}
.daybar:hover{background:var(--card)}
.daybar b{font-weight:620}
.daybar .s{color:var(--mu)}
.daybar s{flex:1}
.daybar .more2{color:var(--dim);font-size:12.5px;display:inline-flex;gap:4px;align-items:center}
.daybar:hover .more2{color:var(--acc)}
.daybar .dot{width:7px;height:7px;border-radius:50%;background:var(--line2);flex:none}
.daybar .dot.on{background:var(--acc)}
.daybar .dot.late{background:var(--bad)}
.today .tkgrp{min-width:0}
.today .tk{grid-template-columns:20px minmax(90px,1fr) auto auto 22px}
.strip{display:flex;flex-direction:column;gap:11px}
.strip .sh{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mu)}
.strip .sh b{color:var(--tx);font-weight:650;font-size:15px}
.strip .sh .nav{margin-left:auto;display:flex;gap:6px;align-items:center}
.days{display:flex;gap:6px;align-items:stretch}
.day{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;
 padding:10px 3px 9px;border-radius:11px;cursor:pointer;border:1px solid transparent;
 transition:background-color .12s,border-color .12s}
.day:hover{background:var(--card2);border-color:var(--line2)}
.day .n{font:600 15px/1 ui-monospace,monospace;color:var(--mu);font-variant-numeric:tabular-nums}
.day .col{width:100%;height:54px;display:flex;align-items:flex-end;justify-content:center}
.day .col i{width:100%;max-width:30px;border-radius:5px;background:var(--line);display:block}
.day .col i.on{background:color-mix(in srgb,var(--acc) 72%,var(--line))}
.day .w{font-size:12px;color:var(--dim);line-height:1}
.day.wknd .w,.day.wknd .n{color:color-mix(in srgb,var(--bad) 55%,var(--dim))}
.day.td .n{color:var(--acc);font-weight:700}
.day.td .col i.on{background:var(--acc)}
.day.sel{background:var(--card2);border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.day.future{opacity:.5}
.day.future .col i{background:none;border:1px dashed var(--line2);min-height:8px}
/* один день под лентой: что именно назначено и что уже случилось */
.dayhd{display:flex;gap:11px;align-items:baseline;flex-wrap:wrap}
.dayhd b{font-size:15px;font-weight:650}
.dayhd .cnt3{font-size:13px;color:var(--dim)}
.dayhd .late{font-size:13px;color:var(--bad);cursor:pointer;border-bottom:1px dashed currentColor}
/* лог дня — не список дел: мельче, приглушённее и по умолчанию свёрнут */
.logbtn{display:flex;gap:9px;align-items:center;width:100%;background:none;border:none;
 border-top:1px solid var(--line);margin-top:6px;padding:9px 8px 4px;color:var(--mu);font:inherit;
 font-size:12.5px;text-align:left}
.logbtn:hover{color:var(--tx)}
.logbtn s{flex:1;height:1px;background:var(--line);text-decoration:none}
.evline{display:grid;grid-template-columns:20px minmax(90px,1fr) auto 22px;gap:11px;align-items:center;
 padding:5px 8px;border-radius:9px;font-size:12.5px;color:var(--dim)}
.evline b{color:var(--mu);font-weight:600}
.evline span.k2{font-size:12px;color:var(--dim);white-space:nowrap}
.evline s{width:7px;height:7px;border-radius:50%;text-decoration:none;justify-self:center;opacity:.75}
/* ---------- дела ----------
   Плоский список без карточек: у разового дела нет содержимого, только текст и срок. */
.tkwrap{padding:14px;display:flex;flex-direction:column;gap:16px;max-width:820px}
.tkbar{display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.tkhint{font-size:12.5px;color:var(--dim)}
.qadd{display:flex;gap:9px;align-items:center;background:var(--card2);border:1px solid var(--line);
 border-radius:10px;padding:9px 12px}
.qadd:focus-within{border-color:var(--acc)}
.qadd input{flex:1;background:none;border:none;outline:none;color:var(--tx);font:inherit;font-size:14px}
.qadd kbd{font:600 12px/1 ui-monospace,monospace;border:1px solid var(--line2);border-radius:5px;
 padding:4px 6px;color:var(--dim)}
.tkgrp{display:flex;flex-direction:column;gap:2px}
.tkh{font-size:12px;font-weight:650;color:var(--mu);display:flex;gap:9px;align-items:center;
 margin:6px 0 4px}
.tkh s{flex:1;height:1px;background:var(--line);text-decoration:none}
.tkh .cnt2{font-family:ui-monospace,monospace;color:var(--dim);font-weight:400}
.tk{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto 22px;gap:11px;align-items:center;
 padding:8px 8px;border-radius:9px;cursor:pointer}
.tk:hover{background:var(--card2)}
.tk s.box{width:18px;height:18px;border:1.5px solid var(--line2);border-radius:5px;display:grid;
 place-items:center;text-decoration:none;color:transparent}
.tk.done{color:var(--dim)}
.tk.done .txt{text-decoration:line-through}
.tk.done s.box{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.tk .txt{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .pj{font-size:12px;color:var(--plan);border:1px solid color-mix(in srgb,var(--plan) 32%,transparent);
 background:color-mix(in srgb,var(--plan) 10%,transparent);border-radius:20px;padding:3px 9px}
.tk .dt{font:12px/1 ui-monospace,monospace;color:var(--dim);white-space:nowrap}
.tk .dt.soft{opacity:0;display:flex;transition:opacity .12s}
.tk:hover .dt.soft,.tk .dt.soft:focus-visible{opacity:.7}
.tk .dt.soft:hover{opacity:1;color:var(--tx)}
.tk.late .dt{color:var(--bad)}
.tk .del{opacity:0;background:none;border:none;color:var(--dim);padding:2px;display:flex;border-radius:5px}
.tk:hover .del{opacity:1}
.tk .del:hover{color:var(--bad)}

/* ---------- календарь ---------- */
.calbar{display:flex;gap:9px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);
 background:var(--card2)}
.calbar b{font-size:15px;font-weight:650}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);
 border-top:1px solid var(--line)}
.cdow{background:var(--card2);padding:7px 9px;font-size:12px;color:var(--mu);text-align:center}
.cday{background:var(--card);min-height:104px;padding:7px 8px;display:flex;flex-direction:column;gap:4px;
 cursor:pointer;transition:background-color .13s}
.cday:hover{background:var(--card2)}
.cday.today{background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.cday.over{background:color-mix(in srgb,var(--acc) 18%,var(--card));outline:1px dashed var(--acc);outline-offset:-2px}
.cday .dn{font:12px/1 ui-monospace,monospace;color:var(--dim);display:flex;align-items:center;gap:6px}
.cday.today .dn{color:var(--acc);font-weight:700}
.cday .dn i{margin-left:auto;font-style:normal;font-size:12px;color:var(--mu)}
.cev{font-size:12px;padding:3px 7px;border-radius:6px;display:flex;gap:6px;align-items:center;
 background:var(--card2);border:1px solid var(--line);color:var(--tx);
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cev.task{border-color:color-mix(in srgb,var(--plan) 35%,transparent);cursor:grab}
.cev.task.done{color:var(--dim);text-decoration:line-through}
.cev.mile{border-color:color-mix(in srgb,var(--ok) 32%,transparent)}
.cev.streak{border-color:color-mix(in srgb,var(--warn) 32%,transparent)}
.cev.num{border-color:color-mix(in srgb,var(--acc) 32%,transparent)}
.cev s{width:6px;height:6px;border-radius:50%;text-decoration:none;flex:none}
.cmore{font-size:12px;color:var(--mu);padding-left:4px}
.cyband{display:flex;gap:9px;align-items:center;padding:8px 14px;font-size:12.5px;color:var(--mu);
 border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--acc) 7%,var(--card2))}

/* ---------- связи: плитки ----------
   Экран отвечает на один вопрос: что доезжает, что выключено, что сломано.
   Поэтому сверху вердикт, ниже плитки, отсортированные по состоянию, и плитка «подключить». */
.verdict{display:flex;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);
 background:color-mix(in srgb,var(--sc) 10%,var(--card2))}
.verdict .vi{color:var(--sc);display:flex;flex:none}
.verdict .big{font-size:18px;font-weight:650;letter-spacing:-.01em;display:block}
.verdict .sub{color:var(--mu);font-size:13px}
.verdict .va{margin-left:auto;display:flex;gap:7px;flex:none}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:12px;
 padding:14px 15px 12px;display:flex;flex-direction:column;gap:11px;cursor:pointer;
 transition:border-color .14s,background-color .14s}
.tile:hover{border-color:var(--line2);background:var(--card3)}
.tile .th{display:flex;gap:10px;align-items:center;color:var(--mu)}
.tile .th b{font-size:15.5px;font-weight:650;color:var(--tx);min-width:0;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.005em}
.chip2{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--sc);
 border:1px solid color-mix(in srgb,var(--sc) 34%,transparent);
 background:color-mix(in srgb,var(--sc) 13%,transparent);border-radius:20px;padding:4px 10px;
 align-self:flex-start}
.chip2 s{width:7px;height:7px;border-radius:50%;background:var(--sc);text-decoration:none}
.tile .facts{display:flex;flex-direction:column;gap:5px}
.tile .fr{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--dim)}
.tile .fr b{margin-left:auto;color:var(--tx);font-weight:400;font-family:ui-monospace,monospace;
 font-variant-numeric:tabular-nums;text-align:right;min-width:0;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}
.tile .wk7{display:flex;gap:3px;align-items:flex-end;height:20px}
.tile .wk7 i{flex:1;border-radius:2px;display:block;
 background:color-mix(in srgb,var(--sc) 55%,transparent)}
.tile .wk7 i.miss{background:var(--line)}
.tile .wl{font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
.tile .acts{display:flex;gap:14px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.tile .acts button{background:none;border:none;padding:0;color:var(--mu);font-size:12px;
 display:inline-flex;gap:6px;align-items:center;font-family:inherit}
.tile .acts button:hover{color:var(--tx)}
.tile.off{opacity:.66}
.tile.bad{border-color:color-mix(in srgb,var(--bad) 42%,var(--line))}
.tile.add{border-style:dashed;justify-content:center;align-items:center;color:var(--dim);gap:9px;
 flex-direction:row;min-height:200px}
.tile.add:hover{border-color:var(--acc);color:var(--tx)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:11px;padding:14px}
.gap{padding:0 14px;font-size:12px;font-weight:650;color:var(--mu);
 display:flex;gap:9px;align-items:center;margin-top:4px}
.gap s{flex:1;height:1px;background:var(--line);text-decoration:none}
/* ---------- связи: старый список (оставлен для раскрытий в подробностях) ---------- */
.intwrap{padding:14px;display:flex;flex-direction:column;gap:15px}
.isum{display:flex;gap:11px;align-items:center;background:var(--card2);border:1px solid var(--line);
 border-radius:11px;padding:11px 13px;font-size:13px;color:var(--mu);flex-wrap:wrap}
.isum b{color:var(--tx)}
.isum .grow{flex:1;min-width:180px}
.isum svg{color:var(--acc);flex:none}
.iprose{font-size:13px;color:var(--mu);line-height:1.6;padding:0 2px 2px;max-width:76ch}
.iprose code{font-family:ui-monospace,monospace;font-size:12px;color:var(--acc)}
.igrp{font-size:12px;font-weight:650;color:var(--mu);margin:3px 0 4px;display:flex;gap:9px;align-items:center}
.igrp s{flex:1;height:1px;background:var(--line);text-decoration:none}
.igrp span{font-family:ui-monospace,monospace;color:var(--dim);font-weight:400}
.irow{display:grid;grid-template-columns:9px 18px minmax(0,1fr) auto auto auto;gap:12px;align-items:center;
 padding:9px 9px;border-bottom:1px solid var(--line);cursor:pointer}
.irow:hover{background:var(--card2)}
.irow.off .inm b,.irow.off .idot{opacity:.6}
.idot{width:9px;height:9px;border-radius:50%;background:var(--sc);
 box-shadow:0 0 0 3px color-mix(in srgb,var(--sc) 18%,transparent)}
.inm{min-width:0;display:flex;flex-direction:column;gap:2px}
.inm b{font-size:13px;font-weight:600;color:var(--tx)}
.inm em{font-style:normal;font-size:12px;color:var(--dim);
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ifact{font-size:12px;color:var(--mu);font-family:ui-monospace,monospace;max-width:200px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iwhen{font-size:12px;color:var(--dim);font-family:ui-monospace,monospace;white-space:nowrap}
.iacts{display:flex;gap:5px;opacity:0;transition:opacity .13s}
.irow:hover .iacts,.irow:focus-within .iacts{opacity:1}
.ix{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease;
 background:var(--card3);border-bottom:1px solid var(--line)}
.ix.op{grid-template-rows:1fr}
.ix>div{overflow:hidden;visibility:hidden;transition:visibility 0s .2s}
.ix.op>div{visibility:visible;transition:visibility 0s}
.ixin{padding:12px 14px 14px 48px;display:grid;grid-template-columns:1.05fr .95fr;gap:18px;align-items:start}
.ixrow{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--dim);padding:3px 0}
.ixrow b{margin-left:auto;color:var(--tx);font-weight:400;font-family:ui-monospace,monospace;
 text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.ixnote{font-size:12px;color:var(--mu);line-height:1.5}
.ixnote b{color:var(--tx);font-weight:600}
.env{display:inline-flex;gap:6px;align-items:center;font-family:ui-monospace,monospace;font-size:12px;
 color:var(--plan);background:color-mix(in srgb,var(--plan) 12%,transparent);
 border:1px solid color-mix(in srgb,var(--plan) 32%,transparent);border-radius:7px;padding:2px 8px}
.diff{font-family:ui-monospace,monospace;font-size:12px;color:var(--mu);white-space:nowrap}
.diff b{color:var(--tx)}
@media(max-width:820px){.ixin{grid-template-columns:1fr}.ifact{display:none}}
@media(max-width:640px){.iwhen{display:none}.iacts{opacity:1}}
.stlab{font-size:12px;color:var(--mu)}
/* витрина интеграций */
.cat2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.offer{display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;align-items:center;text-align:left;
 background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--tx)}
.offer:hover{border-color:var(--acc);background:var(--card3)}
.offer .ol{color:var(--mu);display:flex;justify-content:center}
.offer:hover .ol{color:var(--tx)}
.offer .on2{min-width:0}
.offer .on2 b{display:block;font-size:13.5px;font-weight:650}
.offer .on2 em{font-style:normal;font-size:12px;color:var(--dim);display:block;line-height:1.35}
.offer .ok2{grid-column:2;font-size:12px;color:var(--dim);margin-top:2px}

/* ---------- карта ---------- */
.mapbar{display:flex;gap:9px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);
 background:var(--card2);flex-wrap:wrap}
.maphint{font-size:12px;color:var(--dim)}
.mapwrap{padding:14px;overflow-x:auto}
.mapsvg{display:block}
.mnode{cursor:pointer}
.mnode rect.bx{fill:var(--card2);stroke:var(--line);transition:.13s}
.mnode:hover rect.bx{stroke:var(--acc);fill:var(--card3)}
.mnode text{font:13px "Segoe UI",system-ui,sans-serif;fill:var(--tx)}
.mnode text.d{font-size:11px;fill:var(--dim)}
.mnode text.gt{font-size:11px;letter-spacing:.05em;text-transform:uppercase;fill:var(--tx);font-weight:600}
.mlink{fill:none;stroke:var(--line2);stroke-width:1.4}
.mdep{fill:none;stroke:var(--warn);stroke-width:1.5;opacity:.75}
.mnode circle.nb{transition:.13s}
.mnode:hover circle.nb{stroke:var(--acc)}
.mglab{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);
 margin:13px 0 5px;display:flex;align-items:center;gap:9px}
.mglab:first-child{margin-top:0}
.mglab s{flex:1;height:1px;background:var(--line);text-decoration:none}
/* соты: площадь = вес проекта, цвет = состояние */
.hexwrap{position:relative;height:470px;border:1px solid var(--line);border-radius:12px;
 background:var(--card2)}
.cell{position:absolute;border-radius:9px;padding:8px 10px;overflow:hidden;cursor:pointer;
 background:color-mix(in srgb,var(--c) 18%,var(--card));
 border:1px solid color-mix(in srgb,var(--c) 42%,transparent);
 display:flex;flex-direction:column;gap:4px;transition:.13s}
.cell:hover{background:color-mix(in srgb,var(--c) 32%,var(--card));border-color:var(--c)}
.cell b{font-size:13px;font-weight:650;color:var(--tx);line-height:1.22;overflow:hidden}
.cell span{font-size:11px;color:var(--mu);font-family:ui-monospace,monospace}
.cell.sm{padding:5px 7px}
.cell.sm b{font-size:11px;font-weight:600}
.cellsubs{display:flex;gap:3px;margin-top:auto}
.cellsubs i{height:4px;border-radius:2px;background:color-mix(in srgb,var(--c) 65%,transparent)}
/* полосы: 12 недель цикла, клетка = неделя */
.lanes{display:flex;flex-direction:column;gap:2px}
.lane{display:grid;grid-template-columns:minmax(90px,1fr) repeat(12,minmax(14px,1fr)) 56px;gap:3px;
 align-items:center;padding:3px 6px;border-radius:8px;cursor:pointer}
.lane:hover{background:var(--card2)}
.lane .lnm{font-size:13px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap;padding-right:9px}
.lane s{height:21px;border-radius:4px;text-decoration:none;display:block}
.lanehd{display:grid;grid-template-columns:minmax(90px,1fr) repeat(12,minmax(14px,1fr)) 56px;gap:3px;
 font:11px/1 ui-monospace,monospace;color:var(--dim);padding:0 6px 7px;text-align:center}

/* ---------- клавиатура и поверхности браузера ----------
   Половина элементов доски — span с обработчиком. Чтобы они работали не только мышью,
   им проставляется tabindex, а фокус обязан быть виден: без кольца навигация вслепую. */
:focus{outline:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:7px}
.row:focus-visible{outline-offset:-2px}
::selection{background:color-mix(in srgb,var(--acc) 32%,transparent);color:var(--tx)}
input,textarea{caret-color:var(--acc)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:20px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--mu)}
::-webkit-scrollbar-track{background:transparent}
/* шеврон стал отдельной кнопкой: раньше клик по строке и клик по имени делали разное */
.caret{background:none;border:none;padding:0;cursor:pointer}
/* то же самое у стрелки подпроекта — она такой же переключатель */
.scar{width:20px;height:20px;margin:0 -2px;border-radius:6px;display:grid;place-items:center;
 transition:transform .16s,background-color .14s,color .14s}
.sp:hover .scar{color:var(--mu)}
.scar:hover{background:var(--card3);color:var(--tx)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ---------- сбой и ожидание ---------- */
.banner{display:flex;gap:10px;align-items:center;padding:9px 14px;font-size:13px;
 background:color-mix(in srgb,var(--bad) 13%,var(--card2));color:var(--tx);
 border-bottom:1px solid color-mix(in srgb,var(--bad) 35%,var(--line))}
.banner svg{color:var(--bad);flex:none}
.banner .grow{flex:1;min-width:0}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid color-mix(in srgb,currentColor 30%,transparent);
 border-top-color:currentColor;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.err{font-size:12px;color:var(--bad);min-height:15px}
.fin.bad{border-color:var(--bad)}
.toastact{background:none;border:1px solid var(--acc);color:var(--acc);border-radius:7px;
 padding:3px 9px;font-size:12px;pointer-events:auto;margin-left:4px}
.toastact:hover{background:color-mix(in srgb,var(--acc) 15%,transparent)}
.toast{pointer-events:none}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(18px);opacity:0;
 background:var(--card);border:1px solid var(--acc);border-radius:9px;padding:9px 14px;font-size:13px;
 transition:.2s;pointer-events:none;z-index:30;box-shadow:var(--shadow);display:flex;gap:9px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast code{font-family:ui-monospace,monospace;font-size:12px;color:var(--acc)}
.hint{color:var(--dim);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;padding:0 2px}
.hint kbd{font:600 11px/1 ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;
 padding:3px 5px;color:var(--mu);background:var(--card)}

/* ---------- вторая гарнитура и узкий экран ----------
   Заголовки и данные набирались одним начертанием: разница была только в размере,
   поэтому иерархия читалась слабо. Display-начертание Segoe UI Variable — другой
   оптический размер той же семьи, а не «второй шрифт ради второго шрифта». */
h1,h2,h3,h4,.pghd b,.gh .ghname b,.sect,.modbox .cap,.drawer .cap{
  font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  letter-spacing:-.012em}
.notvault{display:flex;gap:var(--s2);align-items:center;padding:9px var(--s3);margin-bottom:var(--s3);
 border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:9px;
 background:color-mix(in srgb,var(--warn) 8%,transparent);color:var(--mu);font-size:12.5px}
.notvault svg{color:var(--warn);flex:none}
.banner.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.banner.bad svg{color:var(--bad)}

@media(max-width:900px){
  /* Шапка в узком окне складывалась в три ряда: полоса цикла на всю ширину и
     подписи на кнопках. Оставляем два ряда — вкладки и действия. */
  .topbar{flex-wrap:wrap;row-gap:var(--s2)}
  .topbar .cycwrap{display:none}
  .topbar #wspick span:not(.n2){display:none}
  .topbar #grpby{display:none}
  .topbar .btn.p span{display:none}
  .brand em{display:none}
  .today .days{overflow-x:auto}
  .row{grid-template-columns:26px 22px minmax(0,1fr) auto}
  .row .cats,.row .spark,.row .updc{display:none}
  .pgbody{grid-template-columns:1fr !important}
}
.note3{display:block;font-style:normal;color:var(--dim);font-size:11.5px;margin-top:2px}
.n2{font-size:11px;color:var(--dim)}
.isec{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4) var(--s4) 0}
/* пространство в строке появляется, только когда пространств больше одного:
   метка «Личное» у всех восьми строк — это шум, а не сведения */
.wsc{display:inline-flex;gap:4px;align-items:center;font-size:11px;color:var(--dim);
 border:1px solid var(--line);border-radius:20px;padding:2px 7px;white-space:nowrap}
.vault{font-style:normal;display:inline-flex;gap:6px;align-items:center;font-size:12.5px;
 color:var(--mu);border:1px solid var(--line);border-radius:20px;padding:3px 9px;cursor:pointer;
 background:none;transition:border-color .16s,color .16s}
.vault:hover{border-color:var(--acc);color:var(--tx)}
.vault s{width:7px;height:7px;border-radius:50%;text-decoration:none;flex:none;background:var(--bad)}
.vault.on s{background:var(--ok)}
/* правки с телефона ещё в пути — состояние ожидания, а не тревоги и не покоя */
.vault.wait s{background:var(--warn)}
.vault.busy{opacity:.6;cursor:default}
.vaultcard{display:flex;flex-direction:column;gap:9px;width:100%;text-align:left;background:var(--card2);
 border:1px solid var(--line);border-radius:12px;padding:15px 16px;color:var(--tx);font:inherit;cursor:pointer}
.vaultcard:hover{border-color:var(--acc)}
.vhd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vhd b{font-size:16px;font-weight:640}
.vsub code{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--mu)}
.vmore{font-size:12.5px;color:var(--acc)}
.vrow{display:grid;grid-template-columns:150px minmax(0,1fr) 190px;gap:12px;align-items:baseline;
 padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.vk{color:var(--mu)}
.vh{color:var(--dim);font-size:12.5px}
.vok,.vbad{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:10px;
 font-size:13.5px;line-height:1.5;margin-bottom:12px}
.vok{background:color-mix(in srgb,var(--ok) 10%,transparent);color:var(--mu)}
.vok svg{color:var(--ok);flex:none;margin-top:2px}
.vbad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--mu)}
.vbad svg{color:var(--bad);flex:none;margin-top:2px}
.vprose{font-size:13.5px;color:var(--mu);line-height:1.6}
.vprose code{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--acc)}
.vacts{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
/* ---------- разбор строки, подсказки, поиск по волту ---------- */
.draftwrap{border-bottom:1px solid var(--line)}
.draftchips:empty{display:none}
.draftchips{display:flex;gap:6px;flex-wrap:wrap;padding:0 var(--s4) 11px 78px}
.pchips{display:contents}
.pch{font-size:11.5px;color:var(--mu);background:var(--card2);border:1px solid var(--line);
 border-radius:20px;padding:3px 9px;white-space:nowrap}
.pch b{color:var(--tx);font-weight:600}
.pch.a{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 42%,var(--line))}
.pch.p{color:var(--plan);border-color:color-mix(in srgb,var(--plan) 42%,var(--line))}

#tips:empty{display:none}
#tips{display:flex;flex-direction:column;gap:1px}
.tip{display:flex;gap:10px;align-items:center;padding:10px var(--s4);font-size:13.3px;
 color:var(--mu);background:color-mix(in srgb,var(--warn) 7%,transparent);
 border-bottom:1px solid var(--line);line-height:1.45}
.tip svg{color:var(--warn);flex:none}
.tip b{color:var(--tx);font-weight:600}
.tip .grow{flex:1;min-width:0}

.vfind{position:fixed;z-index:41;background:var(--card);border:1px solid var(--line2);
 border-radius:11px;box-shadow:var(--shadow);overflow:hidden;display:none;max-height:52vh;overflow-y:auto}
.vfind.on{display:block}
.vfhd{font:600 11px/1 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;
 color:var(--dim);padding:9px 12px;border-bottom:1px solid var(--line)}
.vfr{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;
 border:none;border-bottom:1px solid var(--line);color:var(--tx);font:inherit;font-size:13.5px;
 padding:9px 12px;cursor:pointer}
.vfr:last-child{border-bottom:none}
.vfr:hover{background:var(--card2)}
.vfr .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vfr .p{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--dim);white-space:nowrap}
.inbrow{grid-template-columns:20px minmax(0,1fr) auto 22px 22px}
textarea.tin{resize:vertical;min-height:120px;line-height:1.5;font-family:inherit}
.qguess:empty{display:none}
.qguess{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 9px 30px}
.pch.alt{background:none;border-style:dashed;color:var(--dim);cursor:pointer;font:inherit;
 font-size:11.5px;padding:3px 9px}
.pch.alt:hover{color:var(--acc);border-color:var(--acc)}
.modh{margin:0;font-size:17px;font-weight:640;letter-spacing:-.012em}
</style>

/* ================= данные ================= */
/* Доска не хранит ничего своего. Всё, что здесь видно, лежит в заметках волта:
   AI\board_index.py собирает из них снимок, AI\board_server.py отдаёт его и
   принимает правки обратно в те же .md. Открыли страницу без сервера — поднимутся
   демо-данные, и об этом будет сказано прямо: макет нельзя путать с доской. */
let P=[], TASKS=[], VAULT=null, LIVE=false, VERR="";
/* Порядок разделов — строка «разделы:» в шапке «10 - Проекты/_index.md».
   Сам раздел появляется в тот момент, когда его вписали в карточку проекта;
   здесь только порядок: что показывать выше, что ниже. */
let SECTS=[];
const NOSECT="Без раздела";

/* здоровье волт считает сам (по дате правки карточки) — здесь только перевод в цвет */
const HMAP={"\u{1F7E2}":"ok","\u{1F7E1}":"warn","\u{1F534}":"bad","\u23F8":"idle","\u2705":"none"};
const hOf=e=>HMAP[(e||"").trim()]||"none";
/* иконка строки — по области: своего поля под неё в стандарте проекта нет */
const AREA_I={"Система":"box","AI":"bot","Творчество":"pad","Игры":"pad","Финансы":"cash",
  "Знания":"puz","Обучение":"grad","Медиа":"mus","Рефлексия":"tgt","Спорт":"rock"};
const iconOf=p=>(p.области||[]).map(a=>AREA_I[a]).find(Boolean)||"box";

function projById(name){
  const p=P.find(x=>x.n===name||x.path===name);
  return p?p.id:null;
}
/* внутри страницы проект живёт под номером: он попадает в data-атрибуты и хеш.
   Путь к заметке хранится рядом — по нему сервер и правит файл. */
function fromVault(d){
  VAULT=d; TODAY=d.сегодня;
  P=d.проекты.filter(x=>x.тип==="проект").map((x,i)=>({
    id:i+1, path:x.путь, n:x.имя, i:iconOf(x),
    cats:(x.области&&x.области.length)?x.области:["без категории"],
    st:x.группа, h:hOf(x.здоровье), ap:x.аппетит, goal:x.цель,
    dd:x.дней_без_движения, upd:x.обновлено||"", act:x.активность||[],
    cyc:x.цикл||"", kind:x.вид||"вехи", ws:x.пространство||"Личное",
    sect:(x.раздел||"").trim(),
    /* веха: [текст, закрыта, дата, строка в заметке] — номер строки нужен серверу */
    m:(x.вехи||[]).map(v=>[v.текст, v.закрыта?1:0, v.дата||"", v.строка]),
    sub:(x.подпроекты||[]).map(s=>({n:s.имя,d:s.что,h:hOf(s.здоровье),m:[]})),
    num:x.число?{cur:x.число.текущее,target:x.число.цель,unit:x.число.единица,log:[]}:null,
    streak:x.серия?{target:x.серия.цель,days:x.серия.дни||[]}:null,
    waitRaw:x.ждёт||[], note:"", deps:[], todo:[],
    links:[x.дом?{t:"Дом",u:x.дом}:null,
           {t:"Заметка",u:x.путь}].filter(Boolean),
    share:null,
  }));
  /* «ждёт» пишется в шапке заметки именами — разворачиваем в номера уже здесь */
  P.forEach(p=>{p.deps=(p.waitRaw||[]).map(projById).filter(v=>v!=null);});
  TASKS=(d.дела||[]).map(t=>({id:t.ид, t:t.текст, when:t.срок||"",
    pid:projById(t.проект), done:!!t.сделано}));
  SECTS=d.разделы||[];
  WS=(d.пространства||[]).map(w=>({id:w.имя, n:w.имя, desc:w.описание||"",
    folder:w.папка||"", own:!!w.своя_папка, readme:!!w.есть_инструкция}));
  if(!WS.some(w=>w.id===WSC)&&WSC!=="все") WSC="все";
  const c=d.цикл;
  CYCLES=[{id:c.имя, n:c.имя, start:c.начало, weeks:c.всего, goal:"", closed:false}];
  CYC=c.имя;
}

const tdOpen=p=>todoOf(p).filter(t=>!t.done).length;

/* Наборы вех для новой карточки. Это не хранилище: выбранный набор один раз
   пишется чекбоксами в заметку и дальше живёт там, а не здесь. */
const TPL={
 "Пустой":["Первая веха"],
 "Геймдев-игра":["Идея и бриф","Ресёрч похожих","Ядро: луп и хук","GDD-документ",

};

/* ---------- люди ----------
   В заметках волта исполнителей нет: чекбокс не знает, кто его закроет. Список
   нужен только экрану пространств — там он про доступ к репозиторию, а не про задачи. */
const ME="Ты";
const PEOPLE=[{n:"Ты",c:"#3FB8AF"},{n:"Художник",c:"#E0765B"},{n:"Саша",c:"#6E8FD0"}];
const pcol=n=>(PEOPLE.find(x=>x.n===n)||{c:"var(--dim)"}).c;
const ini=n=>n.slice(0,1).toUpperCase();

/* ================= виды проектов =================
   Не всё меряется вехами. У «собрать 5 000» прогресс — деньги, у «30 дней подряд» —
   непрерывность, у постоянного дела конца нет вовсе, а у ожидания конец зависит не от тебя. */
const KINDS=[
 {k:"вехи",     i:"flag",  d:"план из шагов · процент считается из закрытых вех"},
 {k:"число",    i:"cash",  d:"цель-число · собрать, накопить, дойти до N"},
 {k:"серия",    i:"rock",  d:"N дней подряд · важна непрерывность, а не сумма"},
 {k:"поток",    i:"sync",  d:"конца нет по замыслу · меряем ритм, а не финиш"},
 {k:"ожидание", i:"pause", d:"конец зависит не от тебя · меряем, сколько ждём"},
];
const KI=k=>(KINDS.find(x=>x.k===k)||KINDS[0]).i;
const KD=k=>(KINDS.find(x=>x.k===k)||KINDS[0]).d;
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");
/* Даты везде в ISO — так они лежат в заметках. Порядковый номер дня считаем
   от эпохи: арифметика «плюс неделя» не должна ломаться на новом годе. */
const ord=s=>Math.round(Date.parse(s+"T00:00:00Z")/86400000);
const unord=o=>new Date(o*86400000).toISOString().slice(0,10);
/* в интерфейсе дата короткая: год виден в заголовке, в строке он только шумит */
const dm=s=>s?s.slice(8,10)+"."+s.slice(5,7):"";
const dnum=s=>+s.slice(8,10);          /* число месяца */
const mnum=s=>+s.slice(5,7);           /* номер месяца */
/* 1970-01-01 — четверг, значит нулевой день эпохи стоит на третьем месте недели */
const dowOf=s=>DOW[(ord(s)+3)%7];
function dseq(d,m,n){const out=[],start=ord(`${d}.${m}`);
  for(let i=0;i<n;i++) out.push(unord(start+i)); return out;}
function curStreak(p){
  const days=[...new Set(p.streak.days)].map(ord).sort((a,b)=>a-b);
  if(!days.length) return 0;
  /* серия считается только если последняя отметка сегодня или вчера — иначе она оборвалась */
  const t=ord(TODAY); if(days[days.length-1]<t-1) return 0;
  let n=1; for(let i=days.length-1;i>0;i--){ if(days[i]-days[i-1]===1) n++; else break; }
  return n;
}
function bestStreak(p){
  const days=[...new Set(p.streak.days)].map(ord).sort((a,b)=>a-b);
  let best=0,n=0;
  days.forEach((d,i)=>{ n = i&&d-days[i-1]===1 ? n+1 : 1; best=Math.max(best,n); });
  return best;
}
const marked=p=>p.streak.days.includes(TODAY);
const weeksAlive=p=>p.act.filter(v=>v>0).length;
/* вид проекта приходит из шапки заметки; чего в шапке нет, того нет и на доске */
function fixKinds(){
  P.forEach(p=>{
    if(p.kind==="число"&&!p.num) p.kind="вехи";
    if(p.kind==="серия"&&!p.streak) p.kind="вехи";
    if(p.kind==="ожидание") p.wait=p.wait||{what:p.goal,who:"",since:p.upd||TODAY,
      last:p.upd||TODAY,check:14};
  });
}

const CV={ok:"var(--ok)",warn:"var(--warn)",bad:"var(--bad)",idle:"var(--idle)",plan:"var(--plan)",none:"var(--dim)"};
const GC={"беклог":"var(--dim)","в работе":"var(--acc)","на паузе":"var(--idle)"};
/* ровно те состояния, что бывают у карточки в волте: лишняя колонка — лишний вопрос */
const GROUPS=["беклог","в работе","на паузе"];
/* Группа на доске ↔ статус в шапке заметки. Раньше смена статуса меняла только
   переменную на странице: строка переезжала, а в заметке оставалось по-старому —
   до первого перечитывания. Теперь любой перенос идёт через заметку. */
const ST_VAULT={"беклог":"идея","в работе":"активно","на паузе":"пауза",
                "готово":"готово","закрыт":"закрыт"};
function setStatus(p,group,quiet){
  const v=ST_VAULT[group];
  if(!v) return toast("warn",`статуса «${group}» в стандарте проекта нет`);
  return apply({что:"поле", проект:p.path, ключ:"статус", значение:v},
               quiet?"":`${p.n} → ${v}`);
}
/* несколько проектов подряд: правки идут по одной, экран перерисуется один раз */
async function setStatusMany(list,group){
  const v=ST_VAULT[group];
  if(!v) return toast("warn",`статуса «${group}» в стандарте проекта нет`);
  let ok=0, bad=0;
  for(const p of list){
    try{ await push({что:"поле", проект:p.path, ключ:"статус", значение:v}); ok++; }
    catch(e){ bad++; }
  }
  try{ fromVault(await pull()); fixKinds(); }catch(e){}
  draw();
  toast(bad?"warn":"swap", bad? `перенесено ${ok}, не вышло ${bad}`
                              : `${plural(ok)} → статус: ${v}`);
}
const ARCH=["готово","закрыт"];
const dn=p=>p.m.filter(x=>x[1]).length;
/* процент считается по-разному — у каждого вида своя мера «сделанности» */
function pc(p){
  if(p.kind==="число")  return p.num.target?Math.min(100,Math.round(100*p.num.cur/p.num.target)):0;
  if(p.kind==="серия")  return p.streak.target?Math.min(100,Math.round(100*curStreak(p)/p.streak.target)):0;
  if(p.kind==="поток")  return Math.round(100*weeksAlive(p)/12);
  if(p.kind==="ожидание") return 0;
  return p.m.length?Math.round(100*dn(p)/p.m.length):0;
}
/* у ожидания процента нет вовсе: показывать 0 % — врать, будто ничего не делается */
const hasPc=p=>p.kind!=="ожидание";
const waitDays=p=>Math.max(0, ord(TODAY)-ord(p.wait.since));
const sinceCheck=p=>Math.max(0, ord(TODAY)-ord(p.wait.last));
function nx(p){
  if(p.kind==="число"){const l=p.num.target-p.num.cur;
    return l>0?`внести ещё ${fmt(l)} ${p.num.unit}`:"цель взята";}
  if(p.kind==="серия") return marked(p)?`сегодня отмечено · серия ${curStreak(p)}`:"отметить сегодня";
  if(p.kind==="ожидание") return p.wait.what||"записать, чего именно ждём";
  return (p.m.find(x=>!x[1])||["всё закрыто"])[0];
}

/* ================= циклы =================
   Цикл — не строка в шапке, а сущность: старт, длина, цель и хвосты в конце.
   Проект живёт в цикле; беклог — это как раз «вне цикла». */
let CYCLES=[
 {id:"2026-C2", n:"Весна", start:"01.04", weeks:12, goal:"Поднять волт и бэкапы в два места", closed:true},
 {id:"2026-C3", n:"Лето",  start:"01.07", weeks:12, goal:"Довести GameDev до живой игры", closed:false},
];
let CYC="2026-C3";
const cycOf=id=>CYCLES.find(c=>c.id===id);
const curCyc=()=>cycOf(CYC)||CYCLES[CYCLES.length-1];
const cycWeek=c=>Math.max(1,Math.min(c.weeks, Math.floor((ord(TODAY)-ord(c.start))/7)+1));
const cycLeft=c=>Math.max(0, ord(c.start)+c.weeks*7-ord(TODAY));
const cycEnd=c=>unord(ord(c.start)+c.weeks*7);
function nextCycId(){
  const m=/^(\d{4})-C(\d+)$/.exec(CYCLES[CYCLES.length-1].id);
  return m? (+m[2]>=4 ? `${+m[1]+1}-C1` : `${m[1]}-C${+m[2]+1}`) : "новый";
}

/* ================= пространства =================
   Личное — весь волт, один приватный репозиторий. Общее — отдельный репозиторий,
   склонированный папкой внутрь волта: у друга такой же Obsidian, синк обычным pull/push.
   Хранилище всегда локальное: доска ничего не держит у себя, только читает файлы и пишет в них. */
/* Пространство — папка в волте, а не режим приложения. Список приходит из
   индекса: «Личное» есть всегда, остальные — папки в «10 - Проекты/Пространства».
   Никакого своего состояния синхронизации у доски нет: волт синхронизируют git и
   Remotely Save, и рисовать рядом с проектами выдуманные «отстал на 3 коммита»
   значило бы показывать то, чего доска не знает. */
let WS=[];
const wsOf=p=>WS.find(w=>w.id===(p.ws||"Личное"))||WS[0]||{id:"Личное",n:"Личное"};
const wsById=id=>WS.find(w=>w.id===id);

let WSC="все";
/* «общий» — свойство не проекта, а папки, в которой он лежит */
const syncAll=()=>{};

/* ================= разовые дела =================
   Позвонить, забрать, оплатить — это не проект: у них нет вех, прогресса и аппетита.
   Живут отдельным списком, могут быть ничьими или висеть на проекте. */
const overdue=t=>t.when&&!t.done&&ord(t.when)<ord(TODAY);
/* Одно дело — одна запись, где бы её ни завели. Разовые лежат в TASKS, задачи проектов
   остаются в своих заметках; общий список показывает и те, и другие через одну обёртку. */
function allTasks(){
  const out=TASKS.map(t=>({ref:t, id:"t"+t.id, t:t.t, when:t.when, pid:t.pid,
    done:!!t.done, src:"дело"}));
  /* веха — такая же единица работы, просто живёт в заметке проекта, а не в списке
     дел. Раньше они шли двумя параллельными списками, и закрытая веха не всплывала
     нигде, кроме страницы проекта. Теперь модель одна. */
  P.forEach(pr=>pr.m.forEach((m,j)=>out.push({
    ref:m, id:`m${pr.id}:${j}`, t:m[0], when:m[1]?(m[2]||"") : "", pid:pr.id,
    done:!!m[1], src:"веха", pr, j, line:m[3]})));
  return out;
}
const byId=id=>allTasks().find(x=>x.id===id);
/* работа проекта одним списком: сначала вехи по порядку заметки, потом дела */
function todoOf(p){
  const A=allTasks().filter(t=>t.pid===p.id);
  return A.filter(t=>t.src==="веха").concat(A.filter(t=>t.src==="дело"));
}
function setDone(x,v){
  if(x.src==="дело")
    apply({что:"дело", ид:x.ref.id, сделано:!!v}, v?"дело закрыто":"дело снова открыто");
  else
    apply({что:"веха", проект:x.pr.path, строка:x.line, текст:x.t, закрыта:!!v},
          v?"веха закрыта в заметке":"веха снова открыта");
}
function setWhen(x,d){
  if(x.src!=="дело") return toast("warn","срок есть у дела, а у вехи — дата закрытия");
  apply({что:"дело", ид:x.ref.id, срок:d||""}, d?`срок ${dm(d)}`:"срок снят");
}
/* ничего не удаляем: закрытое дело уезжает в раздел «Сделано» той же заметки */
function dropTask(x){
  if(x.src!=="дело") return toast("warn","веха живёт в заметке проекта — убирать её оттуда");
  apply({что:"дело", ид:x.ref.id, сделано:true}, "дело закрыто и убрано из списка");
}

/* календарь показывает не только дела: вехи, отметки серий и пополнения тоже имеют дату */
function eventsOn(d){
  const out=[];
  allTasks().filter(t=>t.when===d).forEach(t=>out.push({k:"дело",t,txt:t.t,done:t.done,pid:t.pid}));
  P.forEach(pr=>{
    pr.m.forEach(m=>{ if(m[1]&&m[2]===d) out.push({k:"веха",txt:m[0],pid:pr.id}); });
    pr.sub.forEach(sb=>sb.m.forEach(m=>{ if(m[1]&&m[2]===d) out.push({k:"веха",txt:`${sb.n}: ${m[0]}`,pid:pr.id}); }));
    if(pr.kind==="серия"&&pr.streak.days.includes(d)) out.push({k:"серия",txt:"отмечен день",pid:pr.id});
    if(pr.kind==="число") pr.num.log.forEach(([dd,v])=>{ if(dd===d)
      out.push({k:"число",txt:`+${fmt(v)} ${pr.num.unit}`,pid:pr.id}); });
  });
  return out;
}
