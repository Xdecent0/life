/* ================= отмена ================= */
function snap(label){
  /* циклы, пространства и каналы — такое же состояние, как проекты: откатывать надо всё разом */
  UNDO.push({label, data:JSON.stringify(P), ws:JSON.stringify(WS), cy:JSON.stringify(CYCLES),
    it:JSON.stringify(INTEG), tk:JSON.stringify(TASKS), cyc:CYC, sel:[...SEL], wd:WEEKDONE});
  if(UNDO.length>40) UNDO.shift();
  const ub=document.getElementById("undo");
  ub.classList.toggle("on", UNDO.length>0);
  ub.disabled=!UNDO.length;
  ub.title=UNDO.length?`Отменить: ${UNDO[UNDO.length-1].label} (Ctrl+Z)`:"Отменять нечего";
}
function undo(){
  const s=UNDO.pop(); if(!s) return toast("undo","отменять нечего");
  P=JSON.parse(s.data); SEL=new Set(s.sel); WEEKDONE=s.wd;
  WS=JSON.parse(s.ws); CYCLES=JSON.parse(s.cy); INTEG=JSON.parse(s.it); CYC=s.cyc;
  if(s.tk) TASKS=JSON.parse(s.tk);
  if(!wsById(WSC)&&WSC!=="все") WSC="все";
  syncAll();
  const ub=document.getElementById("undo");
  ub.classList.toggle("on", UNDO.length>0);
  ub.disabled=!UNDO.length;
  ub.title=UNDO.length?`Отменить: ${UNDO[UNDO.length-1].label} (Ctrl+Z)`:"Отменять нечего";
  toast("undo",`отменено: ${s.label}`); draw();
}

/* ================= телефон =================
   Круг с приложением «Проекты» ездит сам, пока эта доска поднята, — а поднята
   она с логина. Метка нужна не для того, чтобы её нажимали, а чтобы было видно,
   что правка из метро уже доехала. Нажатие — для нетерпеливых. */
let PHONE=null;
function phoneChip(){
  if(!PHONE) return "";
  const wait=PHONE.ждут||0;
  const cls=PHONE.идёт?"busy":PHONE.ок===false?"off":wait?"wait":"on";
  const text=PHONE.идёт?"телефон…":wait?`телефон · ${wait}`:"телефон";
  return `<em class="vault ${cls}" data-phone="1" title="${esc(PHONE.текст||"")} — нажми, чтобы прогнать сейчас">
    <s></s>${esc(text)}</em>`;
}
async function phoneAsk(method){
  try{
    const r=await fetch("/api/phone",{method,cache:"no-store"});
    if(!r.ok) return;
    PHONE=await r.json(); drawBrand();
  }catch(e){ /* моста нет — метки просто не будет */ }
}
async function phoneNow(){
  if(PHONE&&PHONE.идёт) return;
  PHONE={...PHONE,идёт:true}; drawBrand();
  await phoneAsk("POST");
  if(PHONE) toast(PHONE.ок===false?"warn":"sync", PHONE.текст||"");
}

/* шапка группы и шапка колонок — одна строка на ту же сетку: две отдельные полосы

/* лента: две недели, у каждого дня число, столбик активности и день недели */
function dayCell(d){
  const future=ord(d)>ord(TODAY);
  const n=future?countPlanned(d):eventsOn(d).length;
  const mx=6, h=n?Math.max(8,Math.round(54*Math.min(n,mx)/mx)):4;
  const dw=dowOf(d), wknd=dw==="сб"||dw==="вс";
  return `<div class="day ${d===TODAY?"td":""} ${d===sel()?"sel":""} ${wknd?"wknd":""} ${future?"future":""}"
      data-hd="${d}"
      title="${dw}, ${dnum(d)} ${MON[mnum(d)]} · ${n?(future?`назначено: ${n}`:`событий: ${n}`):"пусто"}">
      <span class="n">${dnum(d)}</span>
      <span class="col"><i class="${n?"on":""}" style="height:${h}px"></i></span>
      <span class="w">${dw}</span>
    </div>`;
}
const sel=()=>SELDAY||TODAY;
const countPlanned=d=>allTasks().filter(t=>t.when===d&&!t.done).length;
function heatMap(){
  const end=ord(TODAY)+STRIPOFF*14;
  const days=Array.from({length:14},(_,i)=>unord(end-13+i));
  const total=days.reduce((a,d)=>a+(ord(d)>ord(TODAY)?countPlanned(d):eventsOn(d).length),0);
  const from=days[0], to=days[13];
  return `<div class="strip">
    <span class="sh"><b>${dnum(from)} ${MON[mnum(from)].slice(0,3)} — ${dnum(to)} ${MON[mnum(to)].slice(0,3)}</b>
      <span>${STRIPOFF>0?"назначено":"событий"} ${total}</span>
      <span class="nav">
        <button class="btn i" data-so="-1" title="Две недели назад">${ic("up",15)}</button>
        <button class="btn s" data-so="0" ${STRIPOFF?"":"disabled"}>сегодня</button>
        <button class="btn i" data-so="1" title="Две недели вперёд">${ic("down",15)}</button>
      </span></span>
    <div class="days">${days.map(dayCell).join("")}</div>
  </div>`;
}

        <b>${title?title+", ":""}${dnum(d)} ${MON[mnum(d)]}</b>
        <span class="cnt3">${mine.filter(t=>!t.done).length

        ${late.length?`<span class="late" data-allt="1">просрочено ${late.length}</span>`:""}
        <span style="margin-left:auto;display:flex;gap:10px">
          ${(VAULT&&(VAULT.входящее||[]).length)?`<button class="lnk" data-inbox="1"
            title="Заметки в 00 - Inbox, ещё не разобранные">${ic("box",12)}Входящее · ${VAULT.входящее.length}</button>`:""}
          <button class="lnk" data-allt="1">${ic("list",12)}Все дела · ${A.filter(t=>!t.done).length}</button></span>
      </div>
      <div class="qadd">${ic("plus",15)}
        <input id="qin" placeholder="что сделать ${d===TODAY?"сегодня":"в этот день"} · «#проект» вешает на проект">
        <kbd>Q</kbd></div>

/* Одно поле на оба вида записи. Отличить звонок от проекта можно по простым
   признакам: срок жизни, глагол в начале, длина. Догадку показываем чипом и
   даём переспорить — угадывать молча было бы хуже, чем спросить. */
const LONG=/(недел|месяц|квартал|год|этап|фаз[аы]|проект|запуск|переезд|ремонт)/i;
const VERB=/^(позвонить|написать|купить|забрать|оплатить|отправить|сходить|записать|проверить|спросить|скинуть|заказать)/i;
function guessKind(v){
  const t=(v||"").trim();
  if(!t) return null;
  if(VERB.test(t)) return "дело";
  if(LONG.test(t)||t.length>60) return "проект";
  return "дело";
}
function paintGuess(v){
  const box=document.getElementById("qguess");
  if(!box) return;
  const g=guessKind(v);
  if(!g){ box.innerHTML=""; return; }
  const q=parseQuick(v);
  box.innerHTML=`<span class="pch ${g==="дело"?"a":"p"}">это <b>${g}</b></span>`
    + (q.when?`<span class="pch">срок <b>${dm(q.when)}</b></span>`:"")
    + `<button class="pch alt" data-qalt="1">сделать ${g==="дело"?"проектом":"делом"}</button>`;
  const alt=box.querySelector("[data-qalt]");
  if(alt) alt.onclick=e=>{
    e.stopPropagation();
    const raw=(document.getElementById("qin")||{}).value||"";
    if(g==="дело"){ DRAFT=true; draw();
      const di=document.getElementById("draftin");
      if(di){ di.value=raw.trim(); di.dispatchEvent(new Event("input")); di.focus(); }
    } else { if(addTask(raw)) document.getElementById("qin").value=""; }
  };
}
/* привязка дня одна на оба вида: свёрнутому нужна только кнопка разворота */
function wireDay(d){
  document.querySelectorAll("[data-dayopen]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); DAYOPEN=b.dataset.dayopen==="1";
    localStorage.setItem("dayopen", DAYOPEN?"1":"0"); draw();});
  if(!DAYOPEN) return;
  wireTasks(document.getElementById("next3"));
  const q=document.getElementById("qin");
  if(q) q.oninput=()=>paintGuess(q.value);
  if(q) q.onkeydown=e=>{e.stopPropagation();
    if(e.key==="Escape"){q.value="";q.blur();paintGuess("");}
    if(e.key!=="Enter") return;
    /* дело падает на выбранный день, если в тексте не указана другая дата */
    const raw=q.value.trim(); if(!raw) return;
    const hasDate=/\s@\S+/.test(raw);
    if(addTask(hasDate?raw:`${raw} @${d}`)){ q.value=""; draw();
      setTimeout(()=>document.getElementById("qin")?.focus(),30); }};
  document.querySelectorAll("[data-hd]").forEach(c=>c.onclick=()=>{ SELDAY=c.dataset.hd; draw(); });
  document.querySelectorAll("[data-so]").forEach(b2=>b2.onclick=()=>{
    const v=+b2.dataset.so;
    STRIPOFF = v===0 ? 0 : STRIPOFF+v;
    if(v===0) SELDAY=TODAY;
    draw();});
  document.querySelectorAll("[data-allt]").forEach(b2=>b2.onclick=allTasksDrawer);
  document.querySelectorAll("[data-inbox]").forEach(b2=>b2.onclick=inboxDrawer);
  const lg=document.querySelector("[data-log]");
  if(lg) lg.onclick=()=>{DAYLOG=!DAYLOG;draw();};
}

function draw(){
  if(PAGE!=null) return drawPage();
  const PA=document.getElementById("pageapp");
  PA.style.display="none"; PA.innerHTML="";   /* та же причина: не держать вторую копию data-атрибутов */
  document.getElementById("boardapp").style.display="";
  document.getElementById("hint").innerHTML= VIEW==="map"?HINT_MAP : VIEW==="int"?HINT_INT
    : HINT_BOARD;
  if(location.hash) location.hash="";
  drawBrand(); drawCycBar(); drawWsBar(); drawBanner(); drawTips();
  /* проявляем только при смене экрана: на каждой галочке моргать нельзя */
  if(SCENE!==VIEW){SCENE=VIEW; fade(document.getElementById("boardapp"));}
  const L=document.getElementById("list");
  document.getElementById("next3").style.display = VIEW==="board"?"":"none";
  document.getElementById("cBoard").textContent=P.filter(p=>!ARCH.includes(p.st)).length;
  document.getElementById("cArch").textContent=P.filter(p=>ARCH.includes(p.st)).length;
  /* группировка нужна только доске — на карте своя, в связях её нет вовсе */
  const gb=document.getElementById("grpby");
  const GBL={sect:["list","разделы"], st:["layer","состояние"], area:["box","область"]};
  gb.innerHTML=ic(GBL[GROUPBY][0],14)+GBL[GROUPBY][1];
  gb.style.visibility = VIEW==="board"?"":"hidden";
  /* карта и связи — свои экраны: у них нет строк, групп и массовых действий */
  if(VIEW==="map"||VIEW==="int"){
    document.getElementById("bulk").classList.remove("on");
    return VIEW==="map"?drawMap():drawInteg();
  }
  /* пространство и цикл фильтруют всё разом: доску, карту и итоги */
  const pool=P.filter(match)
    .filter(p=>WSC==="все"||(p.ws||"личное")===WSC)
    .filter(p=>CYCF==="все"||(CYCF==="без"?!p.cyc:p.cyc===CYC));
  if(VIEW==="arch"){
    L.innerHTML=blockHTML("архив","var(--idle)",sorted(pool.filter(p=>ARCH.includes(p.st))));
  } else if(GROUPBY==="area"){
    /* по главной категории — иначе проект с тремя категориями попал бы в три группы */
    const areas=[...new Set(P.filter(p=>!ARCH.includes(p.st)).map(A1))].sort((a,b)=>a.localeCompare(b,"ru"));
    L.innerHTML=areas.map(a=>blockHTML(a,areaColor(a),
      sorted(pool.filter(p=>A1(p)===a&&!ARCH.includes(p.st))))).join("");
  } else if(GROUPBY==="sect"){
    /* Раздел — своё слово из шапки карточки. Порядок берём из индекса папки:
       алфавит не догадается, что «Главное сейчас» должно быть выше «Фона». */
    const live=pool.filter(p=>!ARCH.includes(p.st));
    const found=[...new Set(live.map(p=>p.sect).filter(Boolean))];
    const order=SECTS.filter(x=>found.includes(x))
      .concat(found.filter(x=>!SECTS.includes(x)).sort((a,b)=>a.localeCompare(b,"ru")));
    const bare=live.filter(p=>!p.sect);
    L.innerHTML=(DRAFT?draftHTML():"")
      + order.map(sec=>blockHTML(sec,"var(--plan)",
          sorted(live.filter(p=>p.sect===sec)),sec)).join("")
      + (bare.length?blockHTML(NOSECT,"var(--dim)",sorted(bare)):"")
      + (order.length?"":`<div class="ghempty">${ic("list",13)}
          <b>Разделов пока нет</b>
          <span>«Ещё» у проекта → Раздел — и он появится здесь</span></div>`);
  } else {
    L.innerHTML=(DRAFT?draftHTML():"")+GROUPS.map(g=>
      blockHTML(g,GC[g],sorted(pool.filter(p=>p.st===g)))).join("");
  }
  /* «+ проект» в шапке раздела и приглашение завести раздел под списком */
  L.querySelectorAll("[data-sectnew]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); NEW.sect=b.dataset.sectnew; openNew();});
  const nsb=L.querySelector("[data-newsect]");
  if(nsb) nsb.onclick=()=>toast("list",
    "раздел появляется, когда его вписали в карточку: «Ещё» у проекта → Раздел");
  next3(); bulkbar(); wire();
  if(DRAFT){const i=document.getElementById("draftin"); if(i) i.focus();}
}

    const list=P.filter(p=>SEL.has(p.id));
    SEL.clear();
    setStatusMany(list,v);
  });
}

/* правка значения прямо на месте: плитка или строка превращается в поле */
function inlineEdit(btn,cap,val,save,ph){
  const host=btn.closest(".stt")||btn.parentElement;
  host.innerHTML=(cap?`<b>${cap}</b>`:"")+
    `<input class="tin" value="${String(val??"").replace(/"/g,"&quot;")}" placeholder="${ph||""}">`;
  const inp=host.querySelector("input"); inp.focus(); inp.select();
  inp.onclick=e=>e.stopPropagation();
  inp.onkeydown=e=>{
    e.stopPropagation();
    if(e.key==="Escape") return draw();
    if(e.key!=="Enter") return;
    save(inp.value.trim()); draw();
  };
  inp.onblur=()=>draw();
}
/* смена вида — самое сильное решение по проекту: меняется и мера, и что видно на странице */
function openKind(p,anchor){
  const M=document.getElementById("menu");
  M.innerHTML=`<div class="cap">Чем меряем этот проект</div>`+
    KINDS.map(k=>`<button data-k="${k.k}" class="${p.kind===k.k?"dis":""}"
      style="align-items:flex-start">
      <span style="display:flex;gap:10px;flex-direction:column">
        <span class="st">${ic(k.i,15)}${k.k}</span>
        <span style="font-size:12px;color:var(--dim);line-height:1.4;max-width:210px">${k.d}</span></span>
      <span class="mk ${p.kind===k.k?"":"off"}">${p.kind===k.k?ic("check",13):""}</span></button>`).join("");
  place(M,anchor);
  M.querySelectorAll("[data-k]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); closeMenu(); snap("вид проекта");
    p.kind=b.dataset.k;
    if(p.kind==="число"&&!p.num) p.num={cur:0,target:1000,unit:"₴",log:[]};
    if(p.kind==="серия"&&!p.streak) p.streak={target:30,days:[]};
    if(p.kind==="ожидание"&&!p.wait) p.wait={what:"",who:"",since:TODAY,last:TODAY,check:14};
    toast(KI(p.kind),`в шапку: <code>вид: ${p.kind}</code> · ${KD(p.kind)}`);
    draw();
  });
}

/* ================= действия ================= */
function act(t,p,btn,ev){
  if(t==="toggle"){
    const id=p.id, row=btn.closest(".row");
    OPEN.has(id)?OPEN.delete(id):OPEN.add(id);
    row.classList.toggle("op");
    document.querySelector(`[data-exp="${id}"]`).classList.toggle("op");
    btn.title=OPEN.has(id)?"Свернуть подробности":"Развернуть подробности";
    return;
  }
  if(t==="menu") return openMenu(p,btn);
  if(t==="cats") return openCats(p,btn);
  if(t==="open") return openPage(p.id,null);
  if(t==="status") return openStatus(p,btn);
  if(t==="sect") return openSect(p,btn);
  /* переименование прямо в заголовке страницы */
  if(t==="rename"||t==="rensub"){
    const sub=t==="rensub"?+btn.dataset.j:null;
    const cur=sub==null?p.n:p.sub[sub].n;
    btn.innerHTML=`<input class="tin" style="font:inherit;padding:4px 8px"
      value="${cur.replace(/"/g,"&quot;")}">`;
    const inp=btn.querySelector("input"); inp.focus(); inp.select();
    inp.onclick=e=>e.stopPropagation();
    inp.onkeydown=e=>{
      e.stopPropagation();
      if(e.key==="Escape") return draw();
      if(e.key!=="Enter") return;
      const v=inp.value.trim(); if(!v) return draw();
      snap("переименование");
      if(sub==null){p.n=v; toast("pencil",`заметка переименована: <code>${v}.md</code>`);}
      else {p.sub[sub].n=v; toast("pencil",`в таблице «Подпроекты»: <code>${v}</code>`);}
      draw();
    };
    inp.onblur=()=>draw();
    return;
  }
  /* вехи подпроекта — добавление со вложенной страницы */
  if(t==="submileopen"){
    const box=document.querySelector(`[data-submilebox="${p.id}:${btn.dataset.j}"]`);
    box.classList.add("on"); btn.style.display="none"; box.querySelector("input").focus(); return;
  }
  if(t==="submileadd"){
    const j=+btn.dataset.j;
    const inp=document.querySelector(`[data-submileadd="${p.id}:${j}"]`), v=(inp.value||"").trim();
    if(!v) return inp.focus();
    snap("веха подпроекта"); p.sub[j].m.push([v,0,""]);
    toast("plus",`подпроект «${p.sub[j].n}»: <code>- [ ] ${v}</code>`); return draw();
  }
  if(t==="delsubmile"){
    const j=+btn.dataset.j, k=+btn.dataset.k;
    snap("веха подпроекта"); const g=p.sub[j].m.splice(k,1)[0];
    toast("x",`убрано: <code>${g[0]}</code>`); return draw();
  }
  if(t==="sel"){
    /* Shift — выделить диапазон от прошлой отмеченной: как в почте и файлах */
    const vis=[...document.querySelectorAll(".row")].map(r=>+r.dataset.id);
    if(ev&&ev.shiftKey&&LASTSEL!=null){
      const a=vis.indexOf(LASTSEL), b=vis.indexOf(p.id);
      if(a>-1&&b>-1) vis.slice(Math.min(a,b),Math.max(a,b)+1).forEach(id=>SEL.add(id));
    } else {
      SEL.has(p.id)?SEL.delete(p.id):SEL.add(p.id);
    }
    LASTSEL=p.id; return draw();
  }
  if(t==="tick"){
    const i=p.m.findIndex(x=>!x[1]); if(i<0) return;
    snap(`веха «${p.m[i][0]}»`);
    p.m[i][1]=1; WEEKDONE++;
    toast("check",`в заметку: <code>- [x] ${p.m[i][0]}</code> · стало ${pc(p)} %`);
    return draw();
  }
  if(t==="delproj"){
    snap(`удалён «${p.n}»`);
    const nm=p.n;
    P=P.filter(x=>x.id!==p.id); SEL.delete(p.id); OPEN.delete(p.id);
    if(PAGE===p.id) backToBoard();
    toast("x",`удалён <code>${nm}</code>`,{label:"Вернуть",fn:undo});
    return draw();
  }
  /* ---------- вид проекта: число, серия, ожидание ---------- */
  if(t==="kind") return openKind(p,btn);
  if(t==="numadd"){
    const box=document.querySelector(`[data-numbox="${p.id}"]`);
    if(!box) return toast("plus","открой вкладку Обзор — там журнал пополнений");
    box.classList.add("on"); box.querySelector("input").focus(); return;
  }
  if(t==="numok"){
    const inp=document.querySelector(`[data-numadd="${p.id}"]`), v=parseInt((inp.value||"").replace(/\s/g,""),10);
    if(!v) return inp.focus();
    snap("пополнение");
    p.num.cur+=v; p.num.log.unshift([TODAY,v]); p.upd=TODAY;
    toast("plus",`в заметку: <code>| ${TODAY} | +${fmt(v)} ${p.num.unit} |</code> · стало ${fmt(p.num.cur)}`);
    return draw();
  }
  if(t==="mark"){
    if(marked(p)) return toast("check","сегодня уже отмечено");
    snap("отметка дня");
    p.streak.days.push(TODAY); p.upd=TODAY; p.dd=0;
    toast("check",`в заметку: <code>- [x] ${TODAY}</code> · серия ${curStreak(p)} дн.`);
    return draw();
  }
  if(t==="ping"){
    snap("проверка");
    p.wait.last=TODAY;
    toast("sync",`в шапку: <code>проверено: ${TODAY}</code> · следующая через ${p.wait.check} дн.`);
    return draw();
  }
  if(t==="settarget") return inlineEdit(btn, p.kind==="число"?"Цель-число":"Длина серии",
    p.kind==="число"?p.num.target:p.streak.target,
    v=>{const n=parseInt(v.replace(/\s/g,""),10)||0; snap("цель");
      if(p.kind==="число") p.num.target=n; else p.streak.target=n;
      toast("pencil",`в шапку: <code>цель: ${n}</code>`);});
  if(t==="setwho") return inlineEdit(btn,"От кого зависит",p.wait.who,
    v=>{snap("ожидание"); p.wait.who=v; toast("pencil",`в шапку: <code>ждём_от: ${v||"—"}</code>`);});
  if(t==="setcheck") return inlineEdit(btn,"Проверять раз в",p.wait.check,
    v=>{snap("ожидание"); p.wait.check=parseInt(v,10)||14;
      toast("pencil",`в шапку: <code>проверять: ${p.wait.check} дн.</code>`);});
  if(t==="setwhat") return inlineEdit(btn,"",p.wait.what,
    v=>{snap("ожидание"); p.wait.what=v; toast("pencil","записано, чего ждём");},
    "чего именно ждём и что тогда изменится");

  /* ---------- задачи ---------- */
  if(t==="todoadd"){
    const inp=document.querySelector(`[data-todoadd="${p.id}"]`), v=(inp.value||"").trim();
    if(!v) return inp.focus();
    const q=parseQuick(v);
    inp.value="";
    apply({что:"дело+", текст:q.t, срок:q.when||"", проект:p.n},
          q.when?`дело на ${dm(q.when)}`:"дело заведено");
    return;
  }
  if(t==="mileadd"){
    /* поле многострочное: список вех человек чаще приносит готовым, а не по одной */
    showModal(`
      <div class="modhd">${ic("flag",18)}<h2 class="modh">Вехи для «${esc(p.n)}»</h2>
        <button class="btn i" id="mx" style="margin-left:auto">${ic("x",15)}</button></div>
      <div class="modbody">
        <div class="fld"><b>Одна строка — одна веха</b>
          <textarea id="milein" class="tin" rows="7"
            placeholder="Прототип на бумаге&#10;Сцена и управление&#10;Первый уровень"></textarea>
          <span class="khint">маркеры «-», «1.» и отступы срежутся сами;
            то, что уже есть в заметке, добавлено не будет</span></div>
      </div>
      <div class="modft"><span class="prev">пойдут в секцию «Вехи» карточки</span>
        <button class="btn" id="mcancel" style="margin-left:auto">Отмена</button>
        <button class="btn p" id="mok">${ic("check",14)}Дописать</button></div>`, ()=>{
      const ta=document.getElementById("milein"); ta.focus();
      document.getElementById("mx").onclick=closeModal;
      document.getElementById("mcancel").onclick=closeModal;
      document.getElementById("mok").onclick=()=>{
        const v=(ta.value||"").trim();
        if(!v) return;
        closeModal();
        apply({что:"веха+", проект:p.path, текст:v}, "вехи дописаны в заметку");
      };
    });
    return;
  }
  /* ---------- пространство и цикл проекта ----------
     Переезд в другое пространство — это переезд файла в другую папку-репозиторий. */
  if(t==="movews"){
    const M=document.getElementById("menu");
    M.innerHTML=`<div class="cap">Где лежит проект</div>
      <div class="note2">Заметка физически переедет в папку этого пространства.
        Кто в нём — тот и увидит проект у себя.</div>`+
      WS.map(w=>{const on=(p.ws||"личное")===w.id;
        return `<button data-mw="${w.id}" class="${on?"dis":""}"><span class="st">
          ${ic(w.i||"box",15)}${w.n}</span>
          <span class="mk ${on?"":"off"}">${on?"здесь":w.kind==="shared"?w.who.length+" чел.":"только ты"}</span>
          </button>`;}).join("")+
      `<div class="sep"></div><button data-mw="+">${ic("plus",15)}Новое пространство</button>`;
    place(M,btn);
    M.querySelectorAll("[data-mw]").forEach(b=>b.onclick=e=>{
      e.stopPropagation(); closeMenu();
      if(b.dataset.mw==="+") return openWsNew();
      snap("переезд проекта");
      const w=wsById(b.dataset.mw);
      p.ws=w.id; syncShare(p);
      toast(w.i||"box",`<code>${p.n}.md</code> → ${w.folder}${w.kind==="shared"?` · видят ${w.who.join(", ")}`:" · только ты"}`);
      draw();});
    return;
  }
  if(t==="setcyc"){
    const M=document.getElementById("menu");
    M.innerHTML=`<div class="cap">В каком цикле</div>`+
      CYCLES.map(c=>`<button data-mc="${c.id}" class="${p.cyc===c.id?"dis":""}"><span class="st">
          ${ic(c.closed?"arch":"flag",15)}${c.n}</span>
        <span class="mk ${p.cyc===c.id?"":"off"}">${p.cyc===c.id?"тут":c.id}</span></button>`).join("")+
      `<div class="sep"></div>
       <button data-mc="">${ic("box",15)}Вне цикла<span class="k">беклог</span></button>`;
    place(M,btn);
    M.querySelectorAll("[data-mc]").forEach(b=>b.onclick=e=>{
      e.stopPropagation(); closeMenu(); snap("цикл проекта");
      p.cyc=b.dataset.mc||null;
      toast("flag", p.cyc? `в шапку: <code>цикл: ${p.cyc}</code>` : `в шапку: <code>цикл:</code> — вне цикла`);
      draw();});
    return;
  }
  /* ---------- общий проект ----------
     Доступ и синк живут на пространстве, а не на проекте: репозиторий один на всю папку. */
  if(t==="share"){
    const w=wsOf(p);
    return wsMenu(w,btn);
  }
}
function ring(pct,c,size=62){
  const r=(size-7)/2, C=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="5.5"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${c}" stroke-width="5.5"
      stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}"
      stroke-dashoffset="${(C*(1-pct/100)).toFixed(1)}"
      transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}
/* порядок «предыдущий / следующий» — тот же, что видно на доске */
function navList(p){
  return ARCH.includes(p.st) ? P.filter(x=>ARCH.includes(x.st))
    : GROUPS.flatMap(g=>sorted(P.filter(x=>x.st===g)));
}
const dkey=d=>d;   /* даты уже в ISO — сортируются как строки */
/* лента: закрытые вехи проекта и его подпроектов, свежие сверху */
function hist(p){
  const ev=[];
  p.m.forEach(m=>{if(m[1]&&m[2]) ev.push([m[2],m[0],""]);});
  p.sub.forEach(s=>s.m.forEach(m=>{if(m[1]&&m[2]) ev.push([m[2],m[0],s.n]);}));
  ev.sort((a,b)=>dkey(b[0]).localeCompare(dkey(a[0])));
  return ev;
}
function tile(cap,body){return `<div class="stt"><b>${cap}</b>${body}</div>`;}
const tAp=p=>tile("Аппетит", p.ap?`<span class="edt" data-t="setap" data-id="${p.id}">${p.ap}</span>`
  :`<button class="setb" data-t="setap" data-id="${p.id}">${ic("plus",12)}объявить</button>`);
const tGoal=p=>tile("Цель", p.goal?`<span class="edt" data-t="setgoal" data-id="${p.id}">${p.goal}</span>`
  :`<button class="setb" data-t="setgoal" data-id="${p.id}">${ic("plus",12)}задать</button>`);
const tIdle=p=>tile("Без движения",`<span class="mono">${p.dd} дн.</span>`);
const tAct=p=>{const c=CV[p.h];
  return tile("Активность · 12 недель", p.act.some(v=>v)
    ? `<span style="display:flex;align-items:center;gap:8px;color:${c}">${spark(p.act,c)}
        <span class="mono" style="color:var(--mu);font-size:12px">${p.act.reduce((a,b)=>a+b,0)}</span></span>`
    : `<span class="off">правок не было</span>`);};
/* шапка с цифрами — своя у каждого вида: мера успеха у них разная */
function statTiles(p){
  const c=CV[p.h];
  const rng=(big,small)=>`<div class="pgring">${ring(pc(p),c)}
    <div class="v"><b>${big}</b><span>${small}</span></div></div>`;
  if(p.kind==="число"){
    const left=Math.max(0,p.num.target-p.num.cur);
    return rng(`${fmt(p.num.cur)}`,`из ${fmt(p.num.target)} ${p.num.unit} · ${pc(p)} %`)
      + tile("Осталось",`<span class="mono">${fmt(left)} ${p.num.unit}</span>`)
      + tile("Пополнить",`<button class="setb" data-t="numadd" data-id="${p.id}">${ic("plus",12)}внести</button>`)
      + tile("Цель-число",`<span class="edt" data-t="settarget" data-id="${p.id}">${fmt(p.num.target)} ${p.num.unit}</span>`)
      + tIdle(p);
  }
  if(p.kind==="серия"){
    return rng(`${curStreak(p)} дн.`,`подряд из ${p.streak.target} · ${pc(p)} %`)
      + tile("Рекорд",`<span class="mono">${bestStreak(p)} дн.</span>`)
      + tile("Сегодня", marked(p)
          ? `<span style="color:var(--ok);display:flex;gap:6px;align-items:center">${ic("check",13)}отмечено</span>`
          : `<button class="setb" data-t="mark" data-id="${p.id}">${ic("check",12)}отметить</button>`)
      + tile("Длина серии",`<span class="edt" data-t="settarget" data-id="${p.id}">${p.streak.target} дн.</span>`)
      + tIdle(p);
  }
  if(p.kind==="поток"){
    return rng(`${weeksAlive(p)} / 12`,`недель с правками · ритм ${pc(p)} %`)
      + tAp(p) + tGoal(p) + tIdle(p) + tAct(p);
  }
  if(p.kind==="ожидание"){
    const over=sinceCheck(p)>=p.wait.check;
    return `<div class="pgring" style="color:var(--idle)">${ic("pause",30)}
        <div class="v"><b>${waitDays(p)} дн.</b><span>ждём с ${p.wait.since}</span></div></div>
      ${tile("От кого зависит",`<span class="edt" data-t="setwho" data-id="${p.id}">${p.wait.who||"не записано"}</span>`)}
      ${tile("Последняя проверка",`<span class="mono">${p.wait.last} · ${sinceCheck(p)} дн. назад</span>`)}
      ${tile("Проверять раз в",`<span class="edt" data-t="setcheck" data-id="${p.id}">${p.wait.check} дн.</span>`)}
      ${tile("Пора ли пинговать", over
        ? `<button class="setb" data-t="ping" data-id="${p.id}"
             style="border-color:var(--warn);color:var(--warn)">${ic("sync",12)}пора — проверить</button>`
        : `<span class="off">через ${p.wait.check-sinceCheck(p)} дн.</span>`)}`;
  }
  return rng(`${pc(p)} %`,`вехи ${dn(p)} / ${p.m.length}`) + tAp(p) + tGoal(p) + tIdle(p) + tAct(p);
}
/* разовые дела, повешенные на этот проект: они живут в общем списке, но видны и тут */

}

function openPage(id,sub){
  PAGE=id; SUBPAGE=(sub==null?null:sub); TAB="обзор"; TODOF="все";
  SEL.clear(); closeMenu(); scrollTo(0,0); draw();
}
function backToBoard(){PAGE=null;SUBPAGE=null;draw();}
function drawPage(){
  const p=P.find(x=>x.id===PAGE);
  if(!p) return backToBoard();
  if(SUBPAGE!=null&&!p.sub[SUBPAGE]) SUBPAGE=null;
  document.getElementById("boardapp").style.display="none";
  /* доску не просто прячем, а вычищаем: у строк те же data-атрибуты, что у страницы,
     и document.querySelector цеплял бы невидимую копию вместо той, что перед глазами */
  document.getElementById("list").innerHTML="";
  document.getElementById("next3").innerHTML="";
  document.getElementById("bulk").classList.remove("on");
  const A=document.getElementById("pageapp");
  A.style.display=""; A.innerHTML = SUBPAGE!=null ? subPageHTML(p,SUBPAGE) : pageHTML(p);
  const scene=`p${PAGE}:${SUBPAGE}`;
  if(SCENE!==scene){SCENE=scene; SCTAB=TAB; fade(A);}
  else if(SCTAB!==TAB){SCTAB=TAB; fade(A.querySelector(".pgbody"));}
  location.hash = SUBPAGE!=null ? `#p${p.id}s${SUBPAGE}` : `#p${p.id}`;
  document.getElementById("hint").innerHTML=
    `<span><kbd>Esc</kbd> назад</span><span><kbd>←</kbd> <kbd>→</kbd> соседний проект</span>
     <span>правки уходят прямо в заметки волта</span>
     <span>адрес страницы: <kbd>${location.hash}</kbd></span>`;
  wire();
  document.querySelectorAll("[data-pg]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const v=b.dataset.pg;
    if(v==="board") return backToBoard();
    if(v==="up") return openPage(p.id,null);
    if(v.startsWith("sub:")) return openPage(p.id,+v.slice(4));
    const l=navList(p), i=l.indexOf(p), t=l[v==="prev"?i-1:i+1];
    if(t) openPage(t.id,null);
  });
}

/* ================= пикер категорий =================
   Меню не закрывается на каждом клике: категорий у проекта может быть несколько,
   и закрытие после первой же галочки заставляло бы открывать его заново. */
function openCats(p,anchor){
  const M=document.getElementById("menu");
  const paint=()=>{
    M.innerHTML=`<div class="cap">Категории проекта</div>
      ${allCats().map(c=>{
        const on=p.cats.includes(c);
        return `<button data-c="${c}"><span class="st">
          <span class="d" style="--sc:${areaColor(c)}"></span>${c}</span>
          <span class="mk ${on?"":"off"}">${on?ic("check",13)+"стоит":""}</span></button>`;}).join("")}
      <div class="sep"></div>
      <div class="add on" style="margin:0 4px 4px">
        <input id="newcat" placeholder="новая категория — Enter"></div>`;
    M.querySelectorAll("[data-c]").forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      const c=b.dataset.c; snap("категории");
      p.cats.includes(c) ? p.cats=p.cats.filter(x=>x!==c) : p.cats.push(c);
      toast("layer", p.cats.length
        ? `в шапку: <code>категории: ${p.cats.join(", ")}</code>`
        : `в шапку: <code>категории:</code> — пусто`);
      refreshCats(p);
    });
    const ni=M.querySelector("#newcat");
    ni.onclick=e=>e.stopPropagation();
    ni.onkeydown=e=>{
      e.stopPropagation();
      if(e.key==="Escape") return closeMenu();
      if(e.key!=="Enter") return;
      const v=(ni.value||"").trim(); if(!v) return;
      snap("новая категория");
      if(!p.cats.includes(v)) p.cats.push(v);
      ni.value="";
      toast("plus",`новая категория <code>${v}</code>`);
      refreshCats(p);
    };
  };
  paint();
  place(M,anchor);
}

function openStatus(p,anchor){
  const M=document.getElementById("menu");
  M.innerHTML=`<div class="cap">Статус проекта</div>`+
    [...GROUPS,...ARCH].map(g=>`<button data-s="${g}" class="${p.st===g?"dis":""}">
      <span class="st"><span class="d" style="--sc:${GC[g]||CV.idle}"></span>${g}</span></button>`).join("");
  place(M,anchor);
  M.querySelectorAll("[data-s]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); closeMenu(); setStatus(p,b.dataset.s);
  });
}

/* Раздел — свободное слово. Меню предлагает те, что уже есть в волте, и даёт
   вписать новое: раздел существует ровно с того момента, как он в чьей-то шапке. */
function openSect(p,anchor){
  const live=P.filter(x=>!ARCH.includes(x.st));
  const found=[...new Set(live.map(x=>x.sect).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"ru"));
  const M=document.getElementById("menu");
  M.innerHTML=`<div class="cap">В какой раздел</div>`
    + (found.length? found.map(g=>`<button data-sc="${esc(g)}" class="${p.sect===g?"dis":""}">
        <span class="st"><span class="d" style="--sc:var(--plan)"></span>${esc(g)}</span></button>`).join("")
      : `<div class="note2">Разделов ещё нет. Впиши первый — он появится на доске.</div>`)
    + `<div class="sep"></div>
       <button data-scnew="1">${ic("plus",15)}Новый раздел…</button>
       ${p.sect?`<button data-sc="">${ic("x",15)}Убрать из раздела</button>`:""}
       <div class="note2">Раздел живёт строкой <code>раздел:</code> в шапке карточки.
         Порядок разделов — в шапке «10 - Проекты/_index.md».</div>`;
  place(M,anchor);
  M.querySelectorAll("[data-sc]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); closeMenu();
    apply({что:"поле", проект:p.path, ключ:"раздел", значение:b.dataset.sc},
          b.dataset.sc? `${p.n} → ${b.dataset.sc}` : "раздел убран");
  });
  const nb=M.querySelector("[data-scnew]");
  if(nb) nb.onclick=e=>{
    e.stopPropagation(); closeMenu();
    inlineEdit(anchor,"Новый раздел",p.sect||"",v=>{
      const name=v.trim();
      if(!name) return;
      if(name.includes(",")) return toast("warn","в названии раздела нельзя запятую");
      apply({что:"поле", проект:p.path, ключ:"раздел", значение:name},
            `${p.n} → ${name}`);
    },"например: Главное сейчас");
  };
  a11y(M);
}

function drawer(title,icon,body,copyText){
  document.getElementById("peekhd").innerHTML=`${ic(icon,18)}<h2 class="modh">${title}</h2>
    ${copyText?`<button class="btn s" id="peekcopy" style="margin-left:auto">${ic("file",13)}Скопировать</button>`:""}
    <button class="btn i" id="peekx" style="${copyText?"":"margin-left:auto"}">${ic("x",15)}</button>`;

  document.getElementById("peek").classList.add("on");
  document.getElementById("peekx").onclick=()=>document.getElementById("peek").classList.remove("on");

function cycleSummary(){
  const c=curCyc();
  /* итог считается по проектам этого цикла, а не по всему волту разом */
  const own=P.filter(p=>p.cyc===c.id);
  const closedNow=own.filter(p=>ARCH.includes(p.st));
  const moved=own.filter(p=>p.st==="в работе");
  const stale=own.filter(p=>!ARCH.includes(p.st)&&p.dd>21);
  const notStarted=P.filter(p=>p.st==="беклог");
  const doneM=own.reduce((a,p)=>a+dn(p),0), allM=own.reduce((a,p)=>a+p.m.length,0);
  const lst=(l,f)=>l.length?`<ul style="margin:0 0 14px;padding-left:18px">${l.map(f).join("")}</ul>`
                           :`<div style="margin-bottom:14px;color:var(--dim)">пусто</div>`;
  drawer(`Итог цикла ${c.id} · ${c.n}`,"flag",`
    <pre>цель цикла: ${c.goal||"не задана"}
недель прошло: ${cycWeek(c)} из ${c.weeks} · осталось ${cycLeft(c)} дн.
проектов в цикле: ${own.length} · вехи ${doneM} / ${allM} · закрыто за неделю: ${WEEKDONE}</pre>
    <h4>Доведено до конца</h4>
    ${lst(closedNow,p=>`<li>${p.n} — ${dn(p)}/${p.m.length}</li>`)}
    <h4>Шло в работе</h4>
    ${lst(moved,p=>`<li>${p.n} — ${pc(p)} %, дальше: ${nx(p)}</li>`)}
    <h4>Кандидаты закрыть насовсем — стоят больше трёх недель</h4>
    ${lst(stale,p=>`<li>${p.n} — ${p.dd} дн. без движения${p.deps.length?`, ждёт: ${p.deps.map(id=>(P.find(x=>x.id===id)||{}).n).join(", ")}`:""}</li>`)}
    <h4>Лежит в беклоге — вне циклов</h4>
    ${lst(notStarted,p=>`<li>${p.n}</li>`)}
    <div style="color:var(--dim);font-size:13px">Решение по каждому кандидату принимаешь ты: продлить аппетит или закрыть с причиной.</div>
    <button class="btn p" id="cycsave" style="margin-top:14px">${ic("file",14)}Записать итог заметкой в волт</button>`);
  const md=[
    `цель цикла: ${c.goal||"не задана"}`,"",
    `- недель прошло: **${cycWeek(c)}** из ${c.weeks}, осталось ${cycLeft(c)} дн.`,
    `- проектов в цикле: **${own.length}**, вехи **${doneM} / ${allM}**`,"",
    "## Доведено до конца","",
    closedNow.length?closedNow.map(p=>`- [[${p.path.replace(/\.md$/,"")}|${p.n}]] — ${dn(p)}/${p.m.length}`).join("\n"):"пусто","",
    "## Шло в работе","",
    moved.length?moved.map(p=>`- [[${p.path.replace(/\.md$/,"")}|${p.n}]] — ${pc(p)} %, дальше: ${nx(p)}`).join("\n"):"пусто","",
    "## Кандидаты закрыть — стоят больше трёх недель","",
    stale.length?stale.map(p=>`- [[${p.path.replace(/\.md$/,"")}|${p.n}]] — ${p.dd} дн. без движения`).join("\n"):"пусто","",
    "## Лежит в беклоге","",
    notStarted.length?notStarted.map(p=>`- [[${p.path.replace(/\.md$/,"")}|${p.n}]]`).join("\n"):"пусто",
  ].join("\n");
  const sv=document.getElementById("cycsave");
  if(sv) sv.onclick=()=>{
    document.getElementById("peek").classList.remove("on");
    apply({что:"итог+", цикл:c.id, цель:c.goal||"", текст:md},
          `итог цикла ${c.id} записан в 10 - Проекты/Циклы`);
  };
}
function weekExport(){
  const moved=P.filter(p=>p.m.some(m=>m[1]&&m[2]===TODAY));
  const stuck=P.filter(p=>p.st==="в работе"&&p.dd>7);
  const next=P.filter(p=>p.st==="в работе"&&!p.m.every(x=>x[1])).slice(0,5);
  const txt=[`## Проекты — неделя ${cycWeek(curCyc())} цикла ${curCyc().id} (${curCyc().n})`,``,
    `**Двинулось:** ${moved.length?moved.map(p=>`${p.n} (${pc(p)} %)`).join(" · "):"ничего"}`,``,
    `**Стоит:** ${stuck.length?stuck.map(p=>`${p.n} — ${p.dd} дн.`).join(" · "):"ничего"}`,``,
    `**Дальше:**`,...next.map(p=>`- ${p.n} — ${nx(p)}`),``,
    `Вех закрыто за неделю: ${WEEKDONE}`].join("\n");
  drawer("Неделя в дневник","file",
    `<pre>${txt.replace(/</g,"&lt;")}</pre>
     <div style="color:var(--dim);font-size:13px">Готовый кусок markdown — вставляется в дневник как есть.</div>`, txt);
}

/* ================= полоса цикла ================= */
function drawCycBar(){
  const bar=document.getElementById("cycbar");
  const c=curCyc(), w=cycWeek(c), n=P.filter(p=>p.cyc===c.id&&!ARCH.includes(p.st)).length;
  bar.innerHTML=`
    <button class="cchip" id="cycpick" title="сменить цикл, настроить, закрыть">
      ${ic(c.closed?"arch":"flag",13)}<b>${c.n}</b><span>${c.id}</span>${ic("chev",11)}</button>
    <div class="wk">${Array.from({length:c.weeks},(_,i)=>
      `<s class="${i<w?"on":""} ${i===w-1?"now":""}" title="неделя ${i+1}"></s>`).join("")}</div>
    <span class="cycinfo"><b>${w}</b>/${c.weeks} нед.<span class="opt2"> · <b>${cycLeft(c)} дн.</b></span><span
      class="opt"> · в цикле <b>${n}</b></span></span>
    <span class="cgoal" id="cycgoal" title="цель цикла — клик, чтобы изменить">${c.goal||"цель цикла не задана"}</span>
    <span style="flex:1;min-width:0"></span>`;
  /* фильтр цикла живёт в правом блоке управления: в ленте слева его сжимало и срезало */
  document.getElementById("cycf").innerHTML=[["все","все"],["этот","в цикле"],["без","вне"]].map(([k,t])=>
    `<button data-cf="${k}" class="${CYCF===k?"on":""}">${t}</button>`).join("");
  document.getElementById("cycpick").onclick=e=>{e.stopPropagation(); openCycMenu(e.currentTarget);};
  document.getElementById("cycgoal").onclick=e=>{e.stopPropagation(); editCycGoal(e.currentTarget);};
  document.querySelectorAll("[data-cf]").forEach(b=>b.onclick=e=>{e.stopPropagation(); CYCF=b.dataset.cf; draw();});
}
function editCycGoal(el){
  const c=curCyc();
  el.innerHTML=`<input class="tin" style="width:270px" value="${esc(c.goal)}"
    placeholder="одна цель на весь цикл">`;
  const i=el.querySelector("input"); i.focus(); i.select();
  i.onclick=e=>e.stopPropagation();
  i.onkeydown=e=>{e.stopPropagation();
    if(e.key==="Escape") return draw();
    if(e.key!=="Enter") return;
    snap("цель цикла"); c.goal=i.value.trim();
    toast("flag",`цель цикла <code>${c.id}</code>: ${c.goal||"снята"}`); draw();};
  i.onblur=()=>draw();
}
function openCycMenu(anchor){
  const M=document.getElementById("menu");
  M.innerHTML=`<div class="cap">Циклы</div>`+
    CYCLES.map(c=>`<button data-cy="${c.id}" class="${c.id===CYC?"dis":""}"><span class="st">
        ${ic(c.closed?"arch":"flag",15)}${c.n}</span>
      <span class="mk ${c.id===CYC?"":"off"}">${c.id===CYC?"открыт сейчас":c.closed?"закрыт":c.id}</span></button>`).join("")+
    `<div class="sep"></div>
     <button data-ca="edit">${ic("pencil",15)}Настроить этот цикл</button>
     <button data-ca="new">${ic("plus",15)}Завести новый цикл</button>
     <button data-ca="sum">${ic("chart",15)}Итог цикла</button>
     <button data-ca="close" class="${curCyc().closed?"dis":""}">${ic("flag",15)}Закрыть цикл и разобрать хвосты</button>`;
  place(M,anchor);
  M.querySelectorAll("[data-cy]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); closeMenu(); CYC=b.dataset.cy;
    toast("flag",`открыт цикл <code>${CYC}</code>`); draw();});
  M.querySelectorAll("[data-ca]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); closeMenu();
    const a=b.dataset.ca;
    if(a==="edit") return openCycEdit(curCyc());
    if(a==="new")  return openCycEdit(null);
    if(a==="sum")  return cycleSummary();
    openCycClose();});
}
/* окно цикла: имя, старт, длина, цель. Даты в макете — только июль-август, считаем по 31 дню */
function openCycEdit(c0){
  const isNew=!c0;
  const c=c0||{id:nextCycId(), n:"", start:TODAY, weeks:12, goal:"", closed:false};
  const paint=()=>showModal(`
    <div class="modhd">${ic(isNew?"plus":"pencil",18)}<h2 class="modh">${isNew?"Новый цикл":"Настройка цикла"}</h2>
      <button class="btn i" id="cx" style="margin-left:auto">${ic("x",15)}</button></div>
    <div class="modbody">
      <div class="row2">
        <div class="fld"><b>Как называем</b>
          <input class="fin" id="cn" value="${esc(c.n)}" placeholder="Лето · Рывок · Q4"></div>
        <div class="fld"><b>Код цикла</b>
          <input class="fin" id="cid" value="${esc(c.id)}" placeholder="2026-C4"></div></div>
      <div class="row2">
        <div class="fld"><b>Старт</b>
          <input class="fin" id="cst" value="${esc(c.start)}" placeholder="дд.мм"></div>
        <div class="fld"><b>Сколько недель</b>
          <input class="fin" id="cw" value="${c.weeks}" inputmode="numeric"></div></div>
      <div class="fld"><b>Цель цикла</b>
        <input class="fin" id="cg" value="${esc(c.goal)}" placeholder="одна главная цель — по ней потом меряем итог">
        <span class="khint">Проекты цикла считаются в итоге; беклог живёт вне циклов и никуда не торопится.</span></div>
    </div>
    <div class="modft"><span class="prev" id="cprev"></span>
      <button class="btn" id="cc" style="margin-left:auto">Отмена</button>
      <button class="btn p" id="cok">${ic("check",14)}${isNew?"Завести":"Сохранить"}</button></div>`,
    B=>{
      const g=id=>document.getElementById(id).value;
      const sync=()=>{c.n=g("cn"); c.id=g("cid").trim()||c.id; c.start=g("cst").trim()||c.start;
        c.weeks=Math.max(1,parseInt(g("cw"),10)||12); c.goal=g("cg");
        document.getElementById("cprev").innerHTML=
          `<b>${c.weeks}</b> недель · с <b>${c.start}</b> по <b>${cycEnd(c)}</b>`;};
      sync();
      B.querySelectorAll("input").forEach(i=>{
        i.oninput=sync;
        i.onkeydown=e=>{e.stopPropagation(); if(e.key==="Enter"){sync();ok();} if(e.key==="Escape") closeModal();};});
      const ok=()=>{
        sync();
        if(!c.n.trim()){document.getElementById("cn").focus(); return toast("plus","у цикла должно быть имя");}
        snap(isNew?"новый цикл":"настройка цикла");
        if(isNew){CYCLES.push(c); CYC=c.id;}
        toast("flag",`цикл <code>${c.id}</code> · ${c.n} · ${c.weeks} нед.`);
        closeModal(); draw();};
      document.getElementById("cok").onclick=ok;
      document.getElementById("cc").onclick=closeModal;
      document.getElementById("cx").onclick=closeModal;
      setTimeout(()=>document.getElementById("cn").focus(),20);
    });
  paint();
}
/* закрытие цикла — тот самый ритуал квартала: по каждому хвосту решение принимается руками */
function openCycClose(){
  const c=curCyc();
  const rest=P.filter(p=>p.cyc===c.id&&!ARCH.includes(p.st));
  const plan={}; rest.forEach(p=>plan[p.id]="next");
  const CH=[["next","перенести"],["backlog","в беклог"],["close","закрыть"]];
  const paint=()=>showModal(`
    <div class="modhd">${ic("flag",18)}<h2 class="modh">Закрыть цикл ${c.n}</h2>
      <button class="btn i" id="zx" style="margin-left:auto">${ic("x",15)}</button></div>
    <div class="modbody">
      <div class="khint">Цикл кончается — хвосты не исчезают сами. По каждому решаешь: тащим дальше,
        возвращаем в беклог или закрываем как есть. Следующий цикл заведётся сразу.</div>
      ${rest.length? rest.map(p=>`<div class="cyrow">
          <span class="nm2">${p.n}<em>${hasPc(p)?pc(p)+" %":waitDays(p)+" дн. ждём"} · ${p.st}</em></span>
          <span class="chipset">${CH.map(([k,t])=>`<button data-z="${p.id}:${k}"
            class="${plan[p.id]===k?"on":""}">${t}</button>`).join("")}</span></div>`).join("")
        : `<div class="emptyline">хвостов нет — цикл закрывается чистым</div>`}
    </div>
    <div class="modft"><span class="prev">следующий цикл: <b>${nextCycId()}</b> · с <b>${cycEnd(c)}</b></span>
      <button class="btn" id="zc" style="margin-left:auto">Отмена</button>
      <button class="btn p" id="zok">${ic("check",14)}Закрыть цикл</button></div>`,
    B=>{
      B.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{
        const [id,k]=b.dataset.z.split(":"); plan[id]=k; paint();});
      document.getElementById("zc").onclick=closeModal;
      document.getElementById("zx").onclick=closeModal;
      document.getElementById("zok").onclick=()=>{
        snap("закрытие цикла");
        c.closed=true;
        const nc={id:nextCycId(), n:"Новый цикл", start:cycEnd(c), weeks:c.weeks, goal:"", closed:false};
        CYCLES.push(nc);
        let moved=0, back=0, shut=0;
        rest.forEach(p=>{
          const d=plan[p.id];
          if(d==="next"){p.cyc=nc.id; moved++;}
          else if(d==="backlog"){p.cyc=null; p.st="беклог"; p.h="none"; back++;}
          else {p.st="закрыт"; p.h="idle"; shut++;}
        });
        CYC=nc.id; CYCF="все"; closeModal();
        toast("flag",`цикл ${c.n} закрыт · перенесено ${moved} · в беклог ${back} · закрыто ${shut}`);
        draw();};
    });
  paint();
}

let HUSH=new Set();
/* ================= подсказки =================
   Всё, о чём здесь говорится, уже посчитано из карточек: дни без движения,

let TIPHUSH=new Set();
function tips(){
  const out=[];
  const live=P.filter(p=>!ARCH.includes(p.st)&&p.st!=="на паузе");
  live.filter(p=>p.dd>21).sort((a,b)=>b.dd-a.dd).slice(0,1).forEach(p=>out.push({
    id:"stale:"+p.id, ic:"pause",
    txt:`<b>${esc(p.n)}</b> не двигался ${p.dd} дн.${p.ap?` при аппетите «${esc(p.ap)}»`:""}.
      Так выглядит проект, который пора либо резать, либо ставить на паузу.`,
    act:"На паузу", fn:()=>setStatus(p,"на паузе")}));
  live.filter(p=>p.m.length>2&&p.m.filter(m=>!m[1]).length===1).slice(0,1).forEach(p=>{
    const last=p.m.find(m=>!m[1]);
    out.push({id:"almost:"+p.id, ic:"flag",
      txt:`У <b>${esc(p.n)}</b> закрыто ${dn(p)} вех из ${p.m.length}.
        Последняя — «${esc(cut(last[0],60))}».`,
      act:"Открыть", fn:()=>openPage(p.id)});
  });
  return out.filter(t=>!TIPHUSH.has(t.id)).slice(0,2);
}

/* ================= дела =================
   Быстрый ввод понимает «@дата» и «#проект», чтобы не открывать окно ради звонка. */
function parseQuick(v){
  let t=v.trim(), when=null, pid=null;
  const md=/\s@(\S+)/.exec(t);
  if(md){
    const w=md[1].toLowerCase();
    /* «03.08» пишут руками, ISO приходит от самой доски — понимаем оба */
    const dmy=/^(\d{2})\.(\d{2})$/.exec(w);
    when = w==="сегодня"?TODAY : w==="завтра"?unord(ord(TODAY)+1)
         : w==="вчера"?unord(ord(TODAY)-1)
         : /^\d{4}-\d{2}-\d{2}$/.test(w)?w
         : dmy?`${TODAY.slice(0,4)}-${dmy[2]}-${dmy[1]}` : null;
    if(when) t=t.replace(md[0],"");
  }
  const mp=/\s#(\S+)/.exec(t);
  if(mp){
    const pr=P.find(x=>x.n.toLowerCase().startsWith(mp[1].toLowerCase()));
    if(pr){ pid=pr.id; t=t.replace(mp[0],""); }
  }
  return {t:t.trim(), when, pid};
}
/* ================= разбор строки =================
   Форма из шести полей — это шесть решений, которые человек уже принял, пока
   печатал название. Разбираем строку и показываем, что поняли, до нажатия:
   ошибку видно сразу, а не после создания карточки. */
/* \w в JS — это латиница: «недель» им не поймать. Классы пишем явно. */
const APPETITE=/(\d+)\s*(вечер[а-яё]*|дн[еяй][а-яё]*|день|недел[а-яё]*|месяц[а-яё]*|год|года|лет)/i;
function parseProject(v){
  let t=(v||"").trim(), area="", sect="", ap="", goal="";
  /* «#геймдев» — область; она же подсказывает иконку строки */
  const ma=/\s#(\S+)/.exec(t);
  if(ma){
    const known=allCats().find(c=>c.toLowerCase().startsWith(ma[1].toLowerCase()));
    area=known||ma[1]; t=t.replace(ma[0],"");
  }
  /* хвост, совпавший с уже существующим разделом, — это раздел, а не часть цели */
  const sects=[...new Set(P.map(p=>p.sect).filter(Boolean))];
  for(const sc of sects.concat(SECTS)){
    const re=new RegExp("[,;]\\s*"+sc.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*$","i");
    if(re.test(t)){ sect=sc; t=t.replace(re,""); break; }
  }
  const mp=APPETITE.exec(t);
  if(mp){ ap=mp[0].trim(); t=t.replace(mp[0],""); }
  t=t.replace(/\s*[,;]\s*$/,"").trim();
  /* «Имя: цель» — двоеточие делит ровно там, где человек и хотел */
  const md=/^([^:]{2,60}):\s*(.+)$/.exec(t);
  if(md){ goal=md[2].replace(/\s*[,;]\s*$/,"").trim(); t=md[1].trim(); }
  return {n:t.replace(/\s*[,;]\s*$/,"").trim(), goal, ap, area, sect};
}
/* чипы под полем: видно, что доска поняла, ещё до создания карточки */
function parseChips(q){
  const c=[];
  if(q.n)    c.push(["имя",q.n,"a"]);
  if(q.goal) c.push(["цель",q.goal,""]);
  if(q.ap)   c.push(["аппетит",q.ap,""]);
  if(q.area) c.push(["область",q.area,"p"]);
  if(q.sect) c.push(["раздел",q.sect,"p"]);
  const cy=curCyc(); if(cy) c.push(["цикл",cy.id,""]);
  return `<div class="pchips">${c.map(([k,v,cl])=>
    `<span class="pch ${cl}">${k} <b>${esc(cut(v,28))}</b></span>`).join("")}</div>`;
}
function addTask(v){
  const q=parseQuick(v);
  if(!q.t) return false;
  const pr=q.pid?P.find(x=>x.id===q.pid):null;
  apply({что:"дело+", текст:q.t, срок:q.when||"", проект:pr?pr.n:""},
        q.when?`дело на ${dm(q.when)}`:"дело заведено");
  return true;
}
function tkRow(t, inDay){
  const pr=t.pid?P.find(x=>x.id===t.pid):null;

  const dt = inDay ? (overdue(t)?dm(t.when):"") : (t.when?dm(t.when):"без срока");
  return `<div class="tk ${t.done?"done":""} ${overdue(t)?"late":""}" data-tk="${t.id}"
      title="${t.src==="веха"?"веха из заметки проекта":"разовое дело"}">

/* ================= карта =================
   Один экран, четыре способа смотреть: из чего состоит, кто кого держит,
   куда уходит объём и как оно шло по неделям цикла. */
/* Четыре вида отвечали на два вопроса: три показывали состав, и только «связи» —
   кто кого ждёт. Оставлены оба вопроса и убрано дублирование. */
const MAPV=[["состав","tree"],["ожидания","net"]];
const MAPH={
 "состав":"из чего состоит: группа → проект → подпроект",
 "ожидания":"стрелка идёт от того, кого ждут, к тому, кто ждёт · «ждёт» пишется в шапке заметки",
};
function mapPool(){
  return P.filter(match)
    .filter(p=>WSC==="все"||(p.ws||"личное")===WSC)
    .filter(p=>CYCF==="все"||(CYCF==="без"?!p.cyc:p.cyc===CYC))
    .filter(p=>!ARCH.includes(p.st));
}
function mapGroups(list){
  if(MAP.by==="категория"){
    const ks=[...new Set(list.map(A1))].sort((a,b)=>a.localeCompare(b,"ru"));
    return ks.map(k=>({k,c:areaColor(k),l:list.filter(p=>A1(p)===k)}));
  }
  if(MAP.by==="пространство"){
    return WS.map(w=>({k:w.n, c:w.kind==="shared"?"var(--plan)":"var(--acc)",
      l:list.filter(p=>(p.ws||"личное")===w.id)})).filter(g=>g.l.length);
  }
  return GROUPS.map(g=>({k:g,c:GC[g],l:list.filter(p=>p.st===g)})).filter(g=>g.l.length);
}
const bez=(x1,y1,x2,y2)=>`M${x1} ${y1}C${(x1+x2)/2} ${y1} ${(x1+x2)/2} ${y2} ${x2} ${y2}`;
const pcTxt=p=>hasPc(p)?`${pc(p)} %`:`${waitDays(p)} дн.`;
function mapTree(list){
  const NH=38, SH=27, GAP=8, GGAP=24;
  const X0=10, W0=142, X1=200, W1=252, X2=490, W2=214;
  let y=16; const nodes=[], links=[];
  mapGroups(list).forEach(g=>{
    const y0=y, pys=[];
    g.l.forEach(p=>{
      const py=y; pys.push(py+NH/2);
      nodes.push({t:"p",x:X1,y:py,w:W1,h:NH,p});
      y+=NH+GAP;
      if(MAP.subs) p.sub.forEach((s,j)=>{
        nodes.push({t:"s",x:X2,y,w:W2,h:SH,s,p,j});
        links.push({d:bez(X1+W1,py+NH/2,X2,y+SH/2),c:CV[s.h]});
        y+=SH+GAP;
      });
    });
    const gy=(y0+(y-GAP))/2;
    nodes.push({t:"g",x:X0,y:gy-16,w:W0,h:32,g});
    pys.forEach(py=>links.push({d:bez(X0+W0,gy,X1,py),c:g.c}));
    y+=GGAP;
  });
  const W=X2+W2+16, H=y+6;
  const body=links.map(l=>`<path class="mlink" d="${l.d}" style="stroke:${l.c};opacity:.5"/>`).join("")+
    nodes.map(n=>{
      if(n.t==="g") return `<g class="mnode">

function mapNet(list){
  const n=list.length;
  const R=Math.min(250, 110+n*8), CX=R+165, CY=R+62, W=CX*2, H=CY*2;
  const pos={};
  list.forEach((p,i)=>{const a=-Math.PI/2+2*Math.PI*i/n;
    pos[p.id]={x:CX+R*Math.cos(a), y:CY+R*Math.sin(a), cs:Math.cos(a)};});
  const edges=[];
  list.forEach(p=>p.deps.forEach(d=>{if(pos[d]) edges.push([d,p.id]);}));
  const nodes=list.map(p=>{
    const q=pos[p.id], c=CV[p.h];
    const rr=Math.min(27, 13+Math.sqrt(p.m.length+p.sub.length*2)*3.4);
    const lx=q.x+(q.cs>0?rr+9:-(rr+9));
    const anchor=q.cs>0.15?"start":q.cs<-0.15?"end":"middle";
    return `<g class="mnode" data-open="${p.id}">
      <circle class="nb" cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${rr.toFixed(1)}"
        style="fill:color-mix(in srgb,${c} 20%,var(--card2));stroke:${c};stroke-width:1.5"/>
      <g transform="translate(${(q.x-8).toFixed(1)},${(q.y-8).toFixed(1)})" style="color:${c}">${ic(p.i,16)}</g>
      <text x="${lx.toFixed(1)}" y="${(q.y-1).toFixed(1)}" text-anchor="${anchor}"
        style="font-size:12px">${cut(p.n,18)}</text>
      <text class="d" x="${lx.toFixed(1)}" y="${(q.y+11).toFixed(1)}" text-anchor="${anchor}">
        ${pcTxt(p)}${p.deps.length?" · ждёт "+p.deps.length:""}</text></g>`;}).join("");
  const lines=edges.map(([a,b])=>{
    const s=pos[a], t=pos[b];
    return `<path class="mdep" d="M${s.x.toFixed(1)} ${s.y.toFixed(1)}Q${CX} ${CY} ${t.x.toFixed(1)} ${t.y.toFixed(1)}"
      marker-end="url(#arw)"/>`;}).join("");
  return `<svg class="mapsvg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <defs><marker id="arw" viewBox="0 0 10 10" refX="26" refY="5" markerWidth="6" markerHeight="6"
      orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--warn)"/></marker></defs>
    ${lines}${nodes}
    ${edges.length?"":`<text class="mglabel" x="${CX}" y="${CY}" text-anchor="middle"
      style="fill:var(--dim);font-size:13px">связей «ждёт» тут нет</text>`}</svg>`;
}
/* деление площади пополам по весу — простые прямоугольники без кривых пропорций */
function tmap(items,x,y,w,h,out){
  if(!items.length) return;
  if(items.length===1) return out.push({...items[0],x,y,w,h});
  const total=items.reduce((a,b)=>a+b.v,0);
  let acc=0,i=0;
  for(;i<items.length-1;i++){acc+=items[i].v; if(acc>=total/2) break;}
  const f=acc/total;
  if(w>=h){tmap(items.slice(0,i+1),x,y,w*f,h,out); tmap(items.slice(i+1),x+w*f,y,w*(1-f),h,out);}
  else     {tmap(items.slice(0,i+1),x,y,w,h*f,out); tmap(items.slice(i+1),x,y+h*f,w,h*(1-f),out);}
}
function mapHex(list){
  const wgt=p=>MAP.size==="активность" ? Math.max(1,p.act.reduce((a,b)=>a+b,0))
            : MAP.size==="задачи"      ? Math.max(1,todoOf(p).length)
            : Math.max(1,p.m.length+p.sub.length*2);
  const items=list.map(p=>({v:wgt(p),p})).sort((a,b)=>b.v-a.v);
  const out=[]; tmap(items,0,0,100,100,out);
  return `<div class="hexwrap">${out.map(o=>{
    const p=o.p, big=o.h>15&&o.w>13;
    return `<div class="cell ${big?"":"sm"}" data-open="${p.id}" style="--c:${CV[p.h]};
      left:calc(${o.x.toFixed(2)}% + 3px);top:calc(${o.y.toFixed(2)}% + 3px);
      width:calc(${o.w.toFixed(2)}% - 6px);height:calc(${o.h.toFixed(2)}% - 6px)">
      <b>${cut(p.n, big?26:16)}</b>
      ${big?`<span>${pcTxt(p)} · ${MAP.size} ${o.v}</span>`:""}
      ${big&&MAP.subs&&p.sub.length?`<div class="cellsubs">${p.sub.map(s=>
        `<i title="${s.n} — ${subPc(s)} %" style="flex:${Math.max(1,s.m.length)}"></i>`).join("")}</div>`:""}
    </div>`;}).join("")}</div>`;
}

const A11Y={
 pause:"На паузу или вернуть в работу", menu:"Ещё действия", toggle:"Развернуть строку",
 sel:"Выбрать проект", cats:"Категории проекта", share:"Участники и синхронизация",
 open:"Открыть страницей", peek:"Быстрый просмотр", promote:"Сделать отдельным проектом",

function a11y(root){
  root.querySelectorAll("button").forEach(b=>{
    if(b.textContent.trim()) return;
    const lbl=b.title||A11Y[b.dataset.t]||A11Y[b.id]||"";
    if(lbl){ b.title=lbl; b.setAttribute("aria-label",lbl); }
  });
  root.querySelectorAll("[data-t],[data-open],[data-mile],[data-sub],[data-pg],[data-submile]")
    .forEach(el=>{
      if(/^(BUTTON|INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
      if(!el.hasAttribute("tabindex")) el.tabIndex=0;
      if(!el.hasAttribute("role")) el.setAttribute("role","button");
      if(!el.getAttribute("aria-label")){
        const t=(el.textContent||"").trim()||A11Y[el.dataset.t]||"";
        if(t) el.setAttribute("aria-label",t.slice(0,60));
      }
    });
  root.querySelectorAll(".row").forEach(r=>{ r.tabIndex=0; r.setAttribute("role","link");
    r.setAttribute("aria-label",`${r.querySelector(".nm").textContent} — открыть страницей`); });
}
/* Enter и пробел на любом элементе с ролью кнопки, стрелки — переход между строками */
document.addEventListener("keydown",e=>{
  const el=document.activeElement;
  if(!el||/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
  if((e.key==="Enter"||e.key===" ")&&el.getAttribute("role")==="button"){
    e.preventDefault(); return el.click();
  }
  const row=el.closest&&el.closest(".row");
  if(!row) return;
  if(e.key==="Enter"){e.preventDefault(); return openPage(+row.dataset.id,null);}
  if(e.key===" "){e.preventDefault(); return peek(P.find(x=>x.id==row.dataset.id));}
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    const all=[...document.querySelectorAll(".row")], i=all.indexOf(row);
    const t=all[i+(e.key==="ArrowDown"?1:-1)];
    if(t){e.preventDefault(); t.focus();}
  }
},true);

async function findVault(q){
  clearTimeout(FINDT);
  FINDT=setTimeout(async()=>{
    if((q||"").trim().length<2){ FIND=null; return paintFind(); }
    try{

/* ================= вложить и вытащить =================
   Проект и подпроект — одна и та же сущность на разной глубине. Поэтому переход
   между ними должен быть движением мыши, а не переписыванием заметки руками. */
function nest(child,parent){
  parent.sub.push({n:child.n, d:child.goal||child.ap||"перенесён из проекта", h:child.h,
    m:child.m.map(m=>[m[0],m[1],m[2]||""])});
  /* чужие подпроекты не теряем — они встают рядом, а не исчезают вместе с карточкой */
  child.sub.forEach(s=>parent.sub.push(s));
  parent.todo.push(...child.todo);
  parent.links.push(...child.links);
  if(child.note) parent.note=(parent.note?parent.note+"\n\n":"")+`— из «${child.n}»: ${child.note}`;
  P=P.filter(x=>x.id!==child.id);
  /* связи, указывавшие на съеденный проект, переводим на нового хозяина */
  P.forEach(x=>{
    x.deps=[...new Set(x.deps.map(d=>d===child.id?parent.id:d))].filter(d=>d!==x.id);
  });
  OPEN.delete(child.id); SEL.delete(child.id);
}
function promote(p,j,st){
  const s=p.sub[j];
  const np={id:Date.now()%100000+j, i:"box", n:s.n, cats:[...p.cats],
    st:st||p.st, h:s.h, ap:"", goal:p.n, dd:0, upd:TODAY, kind:"вехи",
    act:new Array(12).fill(0), m:s.m.map(m=>[m[0],m[1],m[2]||""]), sub:[],
    note:s.d&&s.d!=="—"?s.d:"", deps:[], links:[], todo:[],
    /* вынесенный кусок остаётся в той же папке и в том же цикле, что и хозяин */
    ws:p.ws, cyc:p.cyc, share:null};
  syncShare(np);
  p.sub.splice(j,1);
  P.splice(P.indexOf(p)+1,0,np);
  return np;
}

/* ================= драг-н-дроп ================= */
let DRAG=null, DRAGSET=[], SUBDRAG=null;
/* тащим пачкой: если строка выделена — едет вся выборка, иначе только она */
function dragSet(id){ return SEL.has(id)&&SEL.size>1 ? [...SEL] : [id]; }
/* «1 проект · 3 проекта · 5 проектов» — иначе в тостах вечное «3 проектов» */
function plural(n){
  const d=n%10, dd=n%100;
  return n+" "+(d===1&&dd!==11?"проект":(d>=2&&d<=4&&(dd<10||dd>=20)?"проекта":"проектов"));
}
function movedList(){ return DRAGSET.map(id=>P.find(x=>x.id===id)).filter(Boolean); }
function clearMarks(){
  document.querySelectorAll(".over-top,.over-bot").forEach(x=>x.classList.remove("over-top","over-bot"));
  document.querySelectorAll(".gh.over").forEach(x=>x.classList.remove("over"));
}
function dnd(){
  document.querySelectorAll(".row").forEach(r=>{
    r.ondragstart=e=>{
      DRAG=+r.dataset.id; DRAGSET=dragSet(DRAG);
      DRAGSET.forEach(id=>document.querySelector(`.row[data-id="${id}"]`)?.classList.add("dragging"));
      e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(DRAG));};
    r.ondragend=()=>{document.querySelectorAll(".dragging").forEach(x=>x.classList.remove("dragging"));
      clearMarks();DRAG=null;DRAGSET=[];};
    /* три зоны: верх и низ — переставить, середина — вложить подпроектом */
    r.ondragover=e=>{if(DRAG==null||DRAGSET.includes(+r.dataset.id))return;e.preventDefault();
      const b=r.getBoundingClientRect(), y=e.clientY-b.top;clearMarks();
      r.classList.add(y<b.height*0.32?"over-top":y>b.height*0.68?"over-bot":"over-in");};
    r.ondrop=e=>{e.preventDefault();e.stopPropagation();if(DRAG==null)return;
      const tgt=P.find(x=>x.id==r.dataset.id), list=movedList();
      if(!tgt||!list.length||list.includes(tgt))return;
      if(r.classList.contains("over-in")){
        snap(list.length>1?`вложено ${list.length} шт.`:`«${list[0].n}» вложен`);
        const names=list.map(x=>x.n);
        list.forEach(x=>nest(x,tgt));
        OPEN.add(tgt.id);
        toast("box",`${names.length>1?plural(names.length):`<code>${names[0]}</code>`}
          → подпроект «${tgt.n}»`);
        clearMarks();return draw();
      }
      snap(list.length>1?`перенос ${list.length} шт.`:"перетаскивание");
      const b=r.getBoundingClientRect(), after=e.clientY>b.top+b.height/2;
      const changed=list.filter(m=>GROUPBY==="st"&&m.st!==tgt.st).length;
      list.forEach(m=>{if(GROUPBY==="st"){m.st=tgt.st; if(tgt.st==="на паузе")m.h="idle"; else if(m.h==="idle")m.h="ok";}});
      list.forEach(m=>P.splice(P.indexOf(m),1));
      const at=P.indexOf(tgt)+(after?1:0);
      P.splice(at,0,...list);
      SORT={k:"manual",d:1};
      toast("grip", changed
        ? `${list.length>1?plural(list.length)+" → ":""}<code>статус: ${tgt.st}</code>`
        : `порядок сохранён${list.length>1?" · "+list.length+" шт.":""}`);
      if(list.length>1) SEL.clear();
      clearMarks();draw();};
  });
  /* подпроект можно вытащить наружу: тащим строку подпроекта на заголовок группы */
  document.querySelectorAll(".sp[data-sub]").forEach(el=>{
    el.setAttribute("draggable","true");
    el.ondragstart=e=>{e.stopPropagation();
      const [pid,j]=el.dataset.sub.split(":").map(Number);
      SUBDRAG={pid,j}; el.classList.add("dragging");
      e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain","sub");};
    el.ondragend=()=>{el.classList.remove("dragging"); SUBDRAG=null; clearMarks();};
  });
  document.querySelectorAll(".gh").forEach(g=>{
    g.ondragover=e=>{if(DRAG==null&&!SUBDRAG)return;e.preventDefault();clearMarks();g.classList.add("over");};
    g.ondragleave=()=>g.classList.remove("over");
    g.ondrop=e=>{e.preventDefault();
      const grp0=g.dataset.grp;
      if(SUBDRAG&&GROUPS.includes(grp0)){
        const par=P.find(x=>x.id===SUBDRAG.pid); if(!par)return;
        snap("подпроект стал проектом");
        const np=promote(par,SUBDRAG.j,grp0);
        SUBDRAG=null; clearMarks();
        toast("up",`<code>${np.n}</code> — теперь отдельный проект · ${grp0}`);
        return draw();
      }
      if(DRAG==null)return;
      const list=movedList(), grp=g.dataset.grp;
      if(!list.length||!GROUPS.includes(grp))return;
      snap(list.length>1?`перенос ${list.length} шт.`:"перетаскивание");
      list.forEach(m=>{m.st=grp; if(grp==="на паузе")m.h="idle"; else if(m.h==="idle")m.h="ok";
        P.splice(P.indexOf(m),1);P.push(m);});
      SORT={k:"manual",d:1};
      toast("swap",`${list.length>1?plural(list.length)+" → ":""}<code>статус: ${grp}</code>`);
      if(list.length>1) SEL.clear();
      clearMarks();draw();};
  });
}

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
  if(e.key==="z"&&(e.ctrlKey||e.metaKey)){e.preventDefault();return undo();}
  /* на странице свой набор: стрелки листают соседние проекты, Esc возвращает */
  if(PAGE!=null){
    const p=P.find(x=>x.id===PAGE);
    if(e.key==="Escape"){e.preventDefault(); return SUBPAGE!=null?openPage(PAGE,null):backToBoard();}
    if((e.key==="ArrowLeft"||e.key==="ArrowRight")&&p&&SUBPAGE==null){
      e.preventDefault();
      const l=navList(p), t=l[l.indexOf(p)+(e.key==="ArrowLeft"?-1:1)];
      if(t) openPage(t.id,null);
    }
    return;
  }
  if(e.key==="/"){e.preventDefault();openSearch();}
  if(e.key==="n"||e.key==="N"||e.key==="т"||e.key==="Т"){e.preventDefault();openNew();}
  if(e.key==="m"||e.key==="M"||e.key==="ь"||e.key==="Ь"){e.preventDefault();setView(VIEW==="map"?"board":"map");}
  /* Q ловится из любого экрана: разовое дело записывается на ходу */
  if(e.key==="q"||e.key==="Q"||e.key==="й"||e.key==="Й"){
    e.preventDefault();
    if(VIEW!=="board") setView("board");
    setTimeout(()=>document.getElementById("qin")?.focus(),40);
  }
  if(e.key==="Escape"){document.getElementById("peek").classList.remove("on");
    closeNew(); SEL.clear();draw();}
  if(e.key==="Enter"){
    const r=document.querySelector(".row:hover"); if(!r)return;
    e.preventDefault(); openPage(+r.dataset.id,null);
  }
  if(e.key===" "){
    const r=document.querySelector(".row:hover"); if(!r)return;
    e.preventDefault(); peek(P.find(x=>x.id==r.dataset.id));
  }
});

/* ---------- адрес страницы ----------
   #p7 — проект, #p7s2 — его подпроект. Работают кнопки «назад/вперёд» браузера
   и перезагрузка: страница открывается там же, где закрыли. */
function parseHash(){
  const m=/^#p(\d+)(?:s(\d+))?$/.exec(location.hash||"");
  if(!m) return {p:null,s:null};
  const id=+m[1];
  return P.some(x=>x.id===id) ? {p:id, s:m[2]==null?null:+m[2]} : {p:null,s:null};
}
addEventListener("hashchange",()=>{
  const w=parseHash();
  if(w.p===PAGE&&w.s===SUBPAGE) return;
  PAGE=w.p; SUBPAGE=w.s; draw();
});

/* у разрушительного действия тост становится кнопкой возврата: подтверждать заранее долго,
   а вот вернуть за шесть секунд — то, что нужно на самом деле */
let tt;function toast(i,h,action){
  const t=document.getElementById("toast");
  t.innerHTML=`<span style="color:var(--acc)">${ic(i,15)}</span><span>${h}</span>`+
    (action?`<button class="toastact">${action.label}</button>`:"");
  if(action) t.querySelector(".toastact").onclick=()=>{t.classList.remove("on");action.fn();};
  t.classList.add("on");clearTimeout(tt);
  tt=setTimeout(()=>t.classList.remove("on"), action?6500:2400);
}
/* ================= связь с волтом =================
   Одна дверь наружу: GET за снимком, POST за правкой. Правка не применяется
   «на глаз» — сервер отвечает свежим снимком, и доска перерисовывается из него.
   Значит увиденное на экране всегда равно тому, что лежит в заметках. */
async function pull(){
  const r=await fetch("/api/board",{cache:"no-store"});
  if(!r.ok) throw new Error("сервер ответил "+r.status);
  return r.json();
}
async function push(req){
  const r=await fetch("/api/do",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(req)});
  const j=await r.json().catch(()=>({ошибка:"ответ не разобрать"}));
  if(!r.ok) throw new Error(j.ошибка||("сервер ответил "+r.status));
  return j.доска;
}
/* правка идёт в волт и только потом на экран: локально «уже сделано» показывать
   нельзя — если заметка не записалась, доска будет врать до перезагрузки */
async function apply(req, okMsg){
  try{
    const d=await push(req);
    fromVault(d); fixKinds(); draw();
    if(okMsg) toast("check", okMsg);
  }catch(e){
    toast("warn", `не записалось: ${e.message}`);
  }
}
/* ================= сторож волта =================
   Правку заметки в Obsidian доска раньше замечала только по кнопке. Теперь
   спрашивает у сервера дешёвый отпечаток (самая свежая правка + число файлов) и
   перечитывает индекс, лишь когда он изменился: холостых чтений волта нет. */
let REV=null, WATCH=null;
async function tick(force){
  /* в фоне не опрашиваем: смысл появляется ровно в тот момент, когда на доску
     вернулись из Obsidian — поэтому возврат во вкладку сам дёргает проверку */
  if((!force && document.hidden) || MENU_OPEN()) return;
  try{
    const r=await fetch("/api/rev",{cache:"no-store"});
    if(!r.ok) return;
    const v=(await r.json()).отпечаток;
    if(REV===null){ REV=v; return; }
    if(v!==REV){ REV=v; fromVault(await pull()); fixKinds(); draw();
      toast("sync","волт изменился — доска обновилась"); }
  }catch(e){ /* сервер прилёг: скажет баннер при следующей правке */ }
}
/* пока открыто меню, окно или идёт ввод — не перерисовываем из-под рук */
const MENU_OPEN=()=>document.getElementById("menu").classList.contains("on")
  || document.getElementById("mod").classList.contains("on")
  || document.getElementById("peek").classList.contains("on")
  || ["INPUT","TEXTAREA"].includes((document.activeElement||{}).tagName);
async function boot(){
  try{
    fromVault(await pull()); fixKinds(); LIVE=true; VERR="";
  }catch(e){
    LIVE=false; VERR=e.message; P=[]; TASKS=[];
  }
  draw();
  phoneAsk("GET");
  if(LIVE&&!WATCH){
    WATCH=setInterval(()=>tick(),4000);
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) tick(true); });
    addEventListener("focus",()=>tick(true));
    tick(true);
  }
}
/* Перенос в телефон: запуск делает ./app.js, когда дверь наружу встала на место.
   На компьютере доски этой строки нет — там boot() вызывается сразу. */
window.__ЗАПУСК = boot;
</script>
