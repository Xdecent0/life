<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c3327">
<title>Уборка</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="../kitchen/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../kitchen/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Уборка">
<link rel="stylesheet" href="../../design/app.css">
<link rel="stylesheet" href="../../design/clean.css">
</head>
<body>


<div class="app">
  <nav class="tabs" id="nav" aria-label="Разделы">
    <!-- The way back out. Every app is one of several now, so the name in the
         corner is the door to the rest of them rather than decoration. -->
    <a class="brand" href="../../hub/" title="Все приложения">
      <span class="brand-mark" aria-hidden="true">У</span>
      <span class="brand-name">Уборка</span>
      <span class="brand-switch" aria-hidden="true">все</span>
    </a>
    <div class="tabs-scroll" data-tabs></div>
    <div class="tabs-foot">
      <button class="sync" type="button" data-sync-status hidden></button>
      <a class="tab" href="#settings" data-route="settings" title="Настройки">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"/></svg>
        <span class="tab-label">Настройки</span>
      </a>
    </div>
    <button class="rail" type="button" data-act="rail" aria-expanded="true" aria-controls="nav"
            aria-label="Свернуть боковую панель">
      <span class="rail-grip" aria-hidden="true"></span>
    </button>
  </nav>

  <!-- The alert is persistent, because a toast that has faded is
       indistinguishable from a working app, and a full storage quota means
       everything since the last write lives only until this tab closes.
       It shares a column with the stage so the phone stacks it above the
       screen and the desktop keeps it out of the sidebar. -->
  <div class="work">
    <div class="alert" data-alert role="alert" hidden></div>
    <div class="stage" data-stage aria-live="polite">
      <!-- Первый кадр до того, как приедет и разберётся код.
           Это единственное ожидание, которое есть всегда и у всех: на телефоне
           по слабой связи модули едут заметно, и всё это время экран был просто
           белым. Скелет держит тот же ритм, что настоящая шапка (132/60 на
           компьютере, 112/60 на телефоне), поэтому в момент подмены ничего не
           прыгает. Первая же отрисовка стирает его целиком. -->
      <main class="screen">
        <header class="pagehead" data-tone="dark">
          <div class="pagehead-name"><span class="skel skel-title"></span></div>
          <div class="pagehead-bar"><span class="skel skel-said"></span></div>
        </header>
        <div class="workbar"><span class="skel skel-tool"></span></div>
        <div class="body">
          <div class="skel skel-row"></div>
          <div class="skel skel-row skel-row--wide"></div>
          <div class="skel skel-row"></div>
          <div class="skel skel-row skel-row--half"></div>
          <div class="skel skel-row skel-row--wide"></div>
        </div>
      </main>
    </div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
